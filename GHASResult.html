    document.getElementById('filterInput').addEventListener('keyup', function() {
        const filterText = this.value.toLowerCase();
        const projectItems = document.querySelectorAll('#projectList > li');

        projectItems.forEach(item => {
            const projectName = item.querySelector('h3').textContent.toLowerCase();
            item.style.display = projectName.includes(filterText) ? 'block' : 'none';
        });

        // after search changes visibility, observe visible unloaded rows
        observeUnloadedFindings();
    });

    document.getElementById('patForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        const pat = document.getElementById('PAT').value.trim();

        if (!pat) {
            console.error('PAT is required.');
            return;
        }

        currentPat = pat;
        sessionStorage.setItem('ado_pat', pat);

        try {
            const projectListElement = document.getElementById('projectList');
            projectListElement.innerHTML = ''; // reset previous result

            const data = await getProjects(pat);
            const totalProjects = data.value.length;
            const loadedProjects = { count: 0 };

            const projectPromises = data.value.map(project =>
                renderProjectDetails(project, projectListElement, loadedProjects, totalProjects, pat)
            );

            await Promise.all(projectPromises);

            // start observing after DOM rows created
            observeUnloadedFindings();
        } catch (error) {
            console.error('Error fetching data:', error);
        }
    });

    let currentPat = '';

    const findingsObserver = new IntersectionObserver(async (entries, observer) => {
        for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            const cell = entry.target;
            observer.unobserve(cell);
            await loadFindingsIntoCell(cell);
        }
    }, {
        root: null,
        rootMargin: '250px 0px', // preload a bit before visible
        threshold: 0.01
    });

    function observeUnloadedFindings() {
        const cells = document.querySelectorAll('td[data-repo-name][data-loaded="0"][data-loading="0"]');
        cells.forEach(cell => findingsObserver.observe(cell));
    }

    async function fetchData(url, pat) {
        const response = await fetch(url, {
            method: 'GET',
            headers: {
                'Authorization': 'Basic ' + btoa(':' + pat)
            }
        });
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.json();
    }

    async function fetchDataWithHeaders(url, pat) {
        const response = await fetch(url, {
            method: 'GET',
            headers: {
                'Authorization': 'Basic ' + btoa(':' + pat)
            }
        });

        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        return { data, headers: response.headers };
    }

    async function getProjects(pat) {
        const apiUrl = `https://dev.azure.com/${organization}/_apis/projects?api-version=5.1`;
        return fetchData(apiUrl, pat);
    }

    async function getPipelines(projectId, pat) {
    	const pipelineUrl = `https://dev.azure.com/${organization}/${projectId}/_apis/build/definitions?api-version=5.1`;
    	return fetchData(pipelineUrl, pat);
    }

    async function getGhasResult(projectId, pat, repo) {
        const top = 100; // page size marker
        let continuationToken = null;
        let page = 0;

        const allFindings = [];
        const seenAlertIds = new Set();
        const seenPageMarkers = new Set();

        while (true) {
            await randomDelay(500, 1500);

            const params = new URLSearchParams({
                'api-version': '7.2-preview.1',
                '$top': String(top)
            });

            if (continuationToken) {
                params.set('continuationToken', continuationToken);
            }

            const url = `https://advsec.dev.azure.com/${organization}/${projectId}/_apis/alert/repositories/${repo}/alerts?${params.toString()}`;
            const { data, headers } = await fetchDataWithHeaders(url, pat);

            const items = Array.isArray(data?.value) ? data.value : [];
            const firstId = items[0]?.alertId ?? 'none';
            const marker = `top=${top}|token=${continuationToken ?? 'start'}|firstId=${firstId}|count=${items.length}`;

            page++;
            console.log(`[GHAS page ${page}] ${marker}`);

            // hard stop if same page signature appears again
            if (seenPageMarkers.has(marker)) {
                console.warn('Duplicate page marker detected. Aborting pagination.');
                break;
            }
            seenPageMarkers.add(marker);

            let addedThisPage = 0;
            for (const f of items) {
                const id = String(f?.alertId ?? '');
                if (!id || seenAlertIds.has(id)) continue;
                seenAlertIds.add(id);
                allFindings.push(f);
                addedThisPage++;
            }

            const nextToken = headers.get('x-ms-continuationtoken');

            // stop conditions
            if (!nextToken) break;
            if (nextToken === continuationToken) {
                console.warn('Continuation token did not change. Aborting pagination.');
                break;
            }
            if (items.length > 0 && addedThisPage === 0) {
                console.warn('Same alert IDs detected on next page. Aborting pagination.');
                break;
            }

            continuationToken = nextToken;
        }

        return { value: allFindings };
    }

            // Parse allrepojson instead of fetching pipelines
            const allrepoData = JSON.parse(allrepojson);
            const matchingRepos = allrepoData.data.filter(repo => 
                repo.projectName === project.name
            );

            for (const repo of matchingRepos) {
                renderPipelineLink(table, c++, pat, repo.ghasid, repo);
            }

    async function renderPipelineLink(table, c, pat, projectId, repo) {
        const tableRepoRow = document.createElement('tr');

        const labelCell = document.createElement('td');
        labelCell.textContent = (c === 1) ? 'Ghas CI' : '';
        labelCell.style.width = '80px';

        const valueCell = document.createElement('td');
        valueCell.style.width = '400px';

        const repoLink = document.createElement('a');
        repoLink.href = `https://dev.azure.com/itbinus/${projectId}/_build?view=folders`;
        repoLink.target = "_blank";
        repoLink.textContent = repo.repoName;
        valueCell.appendChild(repoLink);

        const findingsCell = document.createElement('td');
        findingsCell.textContent = 'Waiting to load...';
        findingsCell.dataset.repoName = repo.repoName;
        findingsCell.dataset.loaded = '0';
        findingsCell.dataset.loading = '0';

        tableRepoRow.appendChild(labelCell);
        tableRepoRow.appendChild(valueCell);
        tableRepoRow.appendChild(findingsCell);
        table.appendChild(tableRepoRow);

        findingsObserver.observe(findingsCell);
    }

    async function loadFindingsIntoCell(findingsCell) {
        if (findingsCell.dataset.loaded === '1' || findingsCell.dataset.loading === '1') return;
        findingsCell.dataset.loading = '1';
        findingsCell.textContent = 'Loading findings...';

        try {
            await randomDelay(800, 2000);

            const repoName = findingsCell.dataset.repoName;
            const sanitizedRepoName = repoName.replace(/[\s_@#\$%\^&\*!]/g, '-');

            const findings = await getGhasResult('1f663eb2-dd63-4b51-b000-f0949e3c8ab0', currentPat, sanitizedRepoName);

            findingsCell.innerHTML = '';

            if (findings.value && findings.value.length > 0) {
                findings.value.forEach(finding => {
                    const tag = document.createElement('a');
                    tag.target = '_blank';
                    tag.href = `./GHASCodeViewer.html?alertId=${encodeURIComponent(finding.alertId)}&repo=${encodeURIComponent(repoName)}&repoKey=${encodeURIComponent(sanitizedRepoName)}#pat=${encodeURIComponent(currentPat)}`;

                    const type = finding.alertType === 'code' ? 'CODE' : (finding.alertType === 'dependency' ? 'DEPS' : finding.alertType);
                    const state = finding.state === 'active' ? '🔳' : (finding.state === 'fixed' ? '✅' : (finding.state === 'dismissed' ? '❎' : finding.state));
                    const sever = finding.severity === 'high' ? '🟠' : (finding.severity === 'medium' ? '🟡' : (finding.severity === 'low' ? '🟢' : (finding.severity === 'critical' ? '🔴' : finding.severity)));

                    const titleSpan = document.createElement('span');
                    titleSpan.className = 'finding-title';

                    const taxonomy = getPrimarySecurityTagFromRules(finding);
                    const primaryTagPrefix = taxonomy.primary ? `[${taxonomy.primary}] ` : '';
                    titleSpan.textContent = `${state}${sever}${type} ${primaryTagPrefix}${finding.title}`;

                    tag.className = `findings ${finding.severity} ${finding.state}`;
                    tag.appendChild(titleSpan);

                    const taxonomySpan = document.createElement('span');
                    taxonomySpan.className = 'finding-location';
                    taxonomySpan.textContent = `CVE: ${taxonomy.cve.join(', ') || '-'} | CWE: ${taxonomy.cwe.join(', ') || '-'}`;
                    tag.appendChild(taxonomySpan);

                    const locationText = getFindingLocationText(finding);
                    if (locationText) {
                        const locationSpan = document.createElement('span');
                        locationSpan.className = 'finding-location';
                        locationSpan.textContent = locationText;
                        tag.appendChild(locationSpan);
                    }

                    findingsCell.appendChild(tag);
                });
            } else {
                findingsCell.textContent = 'No findings found';
            }

            findingsCell.dataset.loaded = '1';
        } catch (error) {
            findingsCell.textContent = 'Error fetching findings';
            console.error('Error fetching GHAS findings:', error);
        } finally {
            findingsCell.dataset.loading = '0';
        }
    }

    function getFindingLocationText(finding) {
        const location =
            finding?.physicalLocations?.[0] ||
            finding?.physicalLocation?.[0] ||
            finding?.physicalLocation ||
            null;

        if (!location) return '';

        const filePath = location.filePath || location.filepath || '';
        const region = location.region || {};

        const lineStart = Number(region.lineStart ?? region.startLine ?? 0);
        const lineEnd = Number(region.lineEnd ?? region.endLine ?? 0);
        const columnStart = Number(region.columnStart ?? region.startColumn ?? 0);
        const columnEnd = Number(region.columnEnd ?? region.endColumn ?? 0);

        const parts = [];

        if (filePath) {
            parts.push(filePath);
        }

        if (lineStart > 0) {
            const lineText = (lineEnd > 0 && lineEnd !== lineStart)
                ? `line ${lineStart}-${lineEnd}`
                : `line ${lineStart}`;
            parts.push(lineText);
        }

        if (columnStart > 0) {
            const colText = (columnEnd > 0 && columnEnd !== columnStart)
                ? `col ${columnStart}-${columnEnd}`
                : `col ${columnStart}`;
            parts.push(colText);
        }

        return parts.join(', ');
    }

    function getPrimarySecurityTagFromRules(finding) {
        const cve = [];
        const cwe = [];
        const seenCve = new Set();
        const seenCwe = new Set();
        const rawTags = [];

        const pushTags = (v) => {
            if (!v) return;
            if (Array.isArray(v)) {
                rawTags.push(...v);
            } else {
                rawTags.push(v);
            }
        };

        // 1) Preferred shape: finding.tools[].rules[].tag / tags
        if (Array.isArray(finding?.tools)) {
            for (const tool of finding.tools) {
                if (!Array.isArray(tool?.rules)) continue;
                for (const rule of tool.rules) {
                    pushTags(rule?.tag);
                    pushTags(rule?.tags);
                    pushTags(rule?.properties?.tag);
                    pushTags(rule?.properties?.tags);
                }
            }
        }

        // 2) Existing/fallback shapes
        if (Array.isArray(finding?.rules)) {
            for (const rule of finding.rules) {
                pushTags(rule?.tag);
                pushTags(rule?.tags);
                pushTags(rule?.properties?.tag);
                pushTags(rule?.properties?.tags);
            }
        }
        if (finding?.rule && typeof finding.rule === 'object') {
            pushTags(finding.rule?.tag);
            pushTags(finding.rule?.tags);
            pushTags(finding.rule?.properties?.tag);
            pushTags(finding.rule?.properties?.tags);
        }

        // 3) Last fallback
        pushTags(finding?.tags);
        pushTags(finding?.properties?.tags);

        for (const t of rawTags) {
            const text = typeof t === 'string'
                ? t
                : (t?.name || t?.id || t?.value || JSON.stringify(t) || '');

            if (!text) continue;
            const up = text.toUpperCase();

            // supports CVE-2024-1234, CVE_2024_1234, CVE:2024:1234, etc.
            const cveMatches = up.match(/CVE[-_:\s]?(\d{4})[-_:\s]?(\d{4,7})/g) || [];
            const cweMatches = up.match(/CWE[-_:\s]?(\d{1,5})/g) || [];

            for (const m of cveMatches) {
                const n = m.match(/(\d{4}).*?(\d{4,7})/);
                if (!n) continue;
                const id = `CVE-${n[1]}-${n[2]}`;
                if (!seenCve.has(id)) {
                    seenCve.add(id);
                    cve.push(id);
                }
            }

            for (const m of cweMatches) {
                const n = m.match(/(\d{1,5})/);
                if (!n) continue;
                const id = `CWE-${n[1]}`;
                if (!seenCwe.has(id)) {
                    seenCwe.add(id);
                    cwe.push(id);
                }
            }
        }

        const primary = cve[0] || cwe[0] || '';
        return { primary, cve, cwe, rawTags };
    }
</script>
