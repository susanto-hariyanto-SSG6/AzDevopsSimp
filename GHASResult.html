    <style>
        #loadingIndicator {
            display: none;
            font-weight: bold;
        }
        #progressContainer {
            margin-top: 20px;
            width:100%;
            border: 1px solid green;
        }
        #progressBar {
            width: 0%;
            height: 30px;
            background-color: green;
            text-align: center;
            color: white;
        }
        
#projectList table{
      border:1px solid #d9d9d9;
      border-radius:6px;
      border-collapse:separate;
      border-spacing:0;
      margin:8px 0 16px 0;
      background:#fff;
    }

    #projectList table td{
      font-size:10pt;
      padding:6px 8px;
      vertical-align:top;
      border-bottom:1px solid #f0f0f0;
    }

    #projectList table tr:last-child td{
      border-bottom:none;
    }

    #projectList table td:nth-child(2) a{
      font-weight:bold;
      text-decoration:none;
    }

    #projectList table td:nth-child(3) a{
      color:#777;
    }

    .findings {
      display:block;
      color:#444;
      text-decoration:none;
      margin-bottom:6px;
      white-space:normal;
    }

    .findings.fixed {
        color:#888;
    }

    .findings a {
        text-decoration: none;
    }

    .finding-title{
        display:block;
    }

    .finding-location{
        display:block;
        font-size:9pt;
        color:#888;
        margin-left:18px;
    }

    .repo-summary{
        margin-top:6px;
        font-size:9pt;
        color:#666;
        line-height:1.4;
        white-space: pre-line; /* allow \n to render as new line */
    }
    table tr td:nth-child(3) {
        overflow-y:scroll;
        max-height: 380px;
        display: block;
    }

    .committer-table-wrapper {
        margin-top: 10px;
        border-top: 2px solid #e0e0e0;
        padding-top: 6px;
        overflow-y: auto;
        max-height: 200px;
    }

    .committer-table-label {
        font-size: 8pt;
        font-weight: bold;
        color: #555;
        margin-bottom: 4px;
    }

    .committer-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 8pt;
    }

    .committer-table th {
        background: #f5f5f5;
        border-bottom: 1px solid #ddd;
        padding: 3px 6px;
        text-align: left;
        position: sticky;
        top: 0;
    }

    .committer-table td {
        border-bottom: 1px solid #f0f0f0;
        padding: 3px 6px;
        vertical-align: top;
    }

    .committer-table tr.summary-row td {
        background: #f5f5f5;
        font-weight: bold;
        border-bottom: 2px solid #ddd;
    }

    .committer-table tr.summary-row:first-child td {
        border-bottom: none;
    }
</style>

    // Built entirely from the shared IndexedDB cache (window.GHASResult.getAllCacheEntries),
    // which is populated across pages (including GHASDashboard's "Load Live Data"). No new
    // network/API calls are made here — only already-loaded findings are inspected.
    let __caseIndexCache = null;      // Map<caseKey, {programmers:Set, projects:Set, repos:Set, count}>
    let __repoProjectMapCache = null; // sanitizedRepoName -> projectName (from allrepojson)

    function sanitizeRepoName(name) {
        return String(name || '').replace(/[\s_@#\$%\^&\*!]/g, '-');
    }

    function getRepoProjectMap() {
        if (__repoProjectMapCache) return __repoProjectMapCache;
        const map = new Map();
        try {
            const allrepoData = JSON.parse(allrepojson);
            for (const r of (allrepoData?.data || [])) {
                if (!r?.repoName) continue;
                map.set(sanitizeRepoName(r.repoName), r.projectName || null);
            }
        } catch (e) {
            console.warn('[CaseIndex] Failed to parse allrepojson for project map:', e.message);

        __repoProjectMapCache = map;
        return map;

    // Identify "the same case" primarily by CVE, falling back to CWE, then to
    // alertType+title when neither taxonomy tag is available.
    function getFindingCaseKey(finding, taxonomy) {
        if (taxonomy?.cve?.length) return 'CVE:' + Array.from(taxonomy.cve).sort().join(',');
        if (taxonomy?.cwe?.length) return 'CWE:' + Array.from(taxonomy.cwe).sort().join(',');
        const type = finding?.alertType || '';
        const title = String(finding?.title || '').trim().toLowerCase();
        return title ? `TITLE:${type}|${title}` : null;
    }

    // Build (or reuse) the cross-repo index of fixed/dismissed cases from cached findings only.
    async function buildCaseIndex(forceRefresh) {
        if (__caseIndexCache && !forceRefresh) return __caseIndexCache;
        const index = new Map();
        try {
            if (!window.GHASResult?.getAllCacheEntries) return index;
            const entries = await window.GHASResult.getAllCacheEntries();
            const repoProjectMap = getRepoProjectMap();

            for (const entry of entries) {
                const key = entry.key || '';
                const urlMatch = key.match(/\/repositories\/([^/]+)\/alerts/i);
                if (!urlMatch) continue; // only GHAS alert entries, skip project lists / commits / etc.
                const sanitizedRepo = urlMatch[1];
                const projectName = repoProjectMap.get(sanitizedRepo) || null;

                const findings = entry.data?.payload?.value;
                if (!Array.isArray(findings)) continue;

                for (const f of findings) {
                    const state = String(f?.state || '').toLowerCase();
                    if (state !== 'fixed' && state !== 'dismissed') continue; // only "occurred and fixed" cases

                    const taxonomy = getPrimarySecurityTagFromRules(f);
                    const caseKey = getFindingCaseKey(f, taxonomy);
                    if (!caseKey) continue;

                    if (!index.has(caseKey)) {
                        index.set(caseKey, { programmers: new Set(), projects: new Set(), repos: new Set(), count: 0 });
                    }
                    const bucket = index.get(caseKey);
                    const programmer = f?.attribution?.name;
                    if (programmer) bucket.programmers.add(programmer);
                    if (projectName) bucket.projects.add(projectName);
                    bucket.repos.add(sanitizedRepo);
                    bucket.count++;
                }
            }
        } catch (e) {
            console.warn('[CaseIndex] Build failed:', e.message);
        }
        __caseIndexCache = index;
        return index;
    }

    function escapeHtml(s) {

    // Attach hover handler to a finding's <a> tag showing distinct programmers/projects

    function attachCaseInsightHover(tagEl, finding, taxonomy) {
        tagEl.addEventListener('mouseenter', async (ev) => {

                if (!bucket || (bucket.programmers.size === 0 && bucket.projects.size === 0)) {
                    html += `<div style="color:#aaa;">No matching fixed/dismissed case found in loaded cache.</div>`;
                } else {
                    const progList = bucket.programmers.size ? Array.from(bucket.programmers).map(escapeHtml).join(', ') : '—';
                    const projList = bucket.projects.size ? Array.from(bucket.projects).map(escapeHtml).join(', ') : '—';

                    html += `<div style="color:#9ab;margin-top:4px;font-size:9pt;">${bucket.count} occurrence(s) across ${bucket.repos.size} repo(s) in cache</div>`;
                }

            }

        const data = await response.json();
        return { data, headers: response.headers };
    }

    // Hash function (same as GHASResult.cache.js for key compatibility)
    function hash(s) {
        let h = 2166136261;
        for (let i = 0; i < s.length; i++) {
            h ^= s.charCodeAt(i);
            h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
        }
        return (h >>> 0).toString(36);
    }

    async function getGhasResult(projectId, pat, repo) {
        const top = 100;
        let continuationToken = null;
        let page = 0;

        const allFindings = [];
        const seenAlertIds = new Set();
        const seenPageMarkers = new Set();
        let fromCache = false;

        while (true) {

            const params = new URLSearchParams({
                'api-version': '7.2-preview.1',
                '$top': String(top)
            });

            if (continuationToken) params.set('continuationToken', continuationToken);

            const url = `https://advsec.dev.azure.com/${organization}/${projectId}/_apis/alert/repositories/${repo}/alerts?${params.toString()}`;
            const { data, headers } = await window.GHASResult.fetchDataWithHeaders(url, pat);

            const isCompactCache = !!(data && data.__compactCache === true);
            if (isCompactCache) {
                fromCache = true;
            }else{
                await randomDelay(500, 1500);
            }

            console.log('[GHASResult] page fetch', {
                repo,
                page: page + 1,
                isCompactCache,
                hasContinuation: !!headers.get('x-ms-continuationtoken'),
                itemCount: Array.isArray(data?.value) ? data.value.length : 0
            });

            const items = Array.isArray(data?.value) ? data.value : [];
            const firstId = items[0]?.alertId ?? 'none';
            const marker = `top=${top}|token=${continuationToken ?? 'start'}|firstId=${firstId}|count=${items.length}`;

            page++;
            if (seenPageMarkers.has(marker)) break;
            seenPageMarkers.add(marker);

            let addedThisPage = 0;
            for (const f of items) {
                const id = String(f?.alertId ?? '');
                if (!id || seenAlertIds.has(id)) continue;
                seenAlertIds.add(id);
                allFindings.push(f);
                addedThisPage++;
            }

            const nextToken = headers.get('x-ms-continuationtoken');
            if (!nextToken) break;
            if (nextToken === continuationToken) break;
            if (items.length > 0 && addedThisPage === 0) break;

            continuationToken = nextToken;
        }

        console.log('[GHASResult] done', { repo, total: allFindings.length, fromCache });
        return { value: allFindings, fromCache };
    }

    async function loadFindingsIntoCell(findingsCell) {
        if (findingsCell.dataset.loaded === '1' || findingsCell.dataset.loading === '1') return;
        findingsCell.dataset.loading = '1';
        findingsCell.textContent = 'Loading findings...';

        try {
            const repoName = findingsCell.dataset.repoName;
            const sanitizedRepoName = repoName.replace(/[\s_@#\$%\^&\*!]/g, '-');
            const alertUrl = `https://advsec.dev.azure.com/${organization}/1f663eb2-dd63-4b51-b000-f0949e3c8ab0/_apis/alert/repositories/${sanitizedRepoName}/alerts`;

            const wasCached = window.GHASResult.isCached ? window.GHASResult.isCached(alertUrl, currentPat) : false;
            const [findings, commits] = await Promise.all([
                getGhasResult('1f663eb2-dd63-4b51-b000-f0949e3c8ab0', currentPat, sanitizedRepoName),
                getCommitsForRepo(repoName, currentPat)
            ]);
            const fromCache = findings.fromCache === true;
            if(!fromCache){
                await randomDelay(100, 600);
            }

            // ✅ ENRICH FINDINGS WITH ATTRIBUTION & STORE BACK TO CACHE
            console.log('[GHASResult] Enriching', findings.value?.length || 0, 'findings with attribution...');
            if (findings.value && findings.value.length > 0 && window.GHASShared?.enrichCacheWithAttribution) {
                try {
                    // Find project name for this repo
                    const allrepoData = JSON.parse(allrepojson);
                    const projectName = allrepoData.data.find(r => r.repoName === repoName)?.projectName || repoName;
                    
                    console.log('[GHASResult] Found project:', projectName);
                    
                    // Enrich findings with programmer attribution
                    const enriched = await window.GHASShared.enrichCacheWithAttribution(
                        findings.value,

                        projectName,
                        repoName,
                        currentPat
                    );
                    console.log('[GHASResult] ✓ Enriched', enriched.length, 'findings with attribution');
                    
                    // Store enriched findings back to IndexedDB
                    if (window.GHASResult.updateCacheWithAttribution) {
                        // Reconstruct the canonical cache key that appendCache (makeBaseKey) stored.
                        // getGhasResult fetches with ?api-version=7.2-preview.1&$top=100 so the stored
                        // key includes those params. alertUrl has none, so we must add them explicitly
                        // before hashing — otherwise idbGet() returns null and the write is silently lost.
                        const cacheParams = new URLSearchParams({'api-version': '7.2-preview.1', '$top': '100'});
                        const canonicalUrl = new URL(`${alertUrl}?${cacheParams.toString()}`);
                        canonicalUrl.searchParams.delete('continuationToken');
                        const cacheKey = 'ghas:' + canonicalUrl.toString() + '|u:' + hash(String(currentPat || ''));
                        
                        console.log('[GHASResult] Updating cache key:', cacheKey.substring(0, 60) + '...');
                        const success = await window.GHASResult.updateCacheWithAttribution(cacheKey, enriched);
                        console.log('[GHASResult] ✓ Updated cache with attribution:', success);
                        
                        // Update the findings value to show enriched data
                        findings.value = enriched;
                    }
                } catch (enrichError) {
                    console.warn('[GHASResult] Attribution enrichment failed (non-blocking):', enrichError.message);
                    // Don't fail the whole load, just continue with unenriched data
                }
            }

            const row = findingsCell.closest('tr');

            // render summary below repo name
            renderFixSummaryForRow(row, findings.value || [], commits.value || []);

            const statusSpan = row?.cells?.[0]?.querySelector('.status-indicator');
            if (statusSpan) {
                if (fromCache) {
                    statusSpan.textContent = '🔄 Reload';
                    statusSpan.style.cursor = 'pointer';
                    statusSpan.onclick = async () => {
                        // Clear only this repo's cache, not all repos
                        if (window.GHASResult.clearCacheByPattern) {
                            await window.GHASResult.clearCacheByPattern(sanitizedRepoName);
                        }
                        findingsCell.dataset.loaded = '0';
                        loadFindingsIntoCell(findingsCell);
                    };
                } else {
                    statusSpan.textContent = '✓ Current Data';
                    statusSpan.style.color = '#28a745';
                    statusSpan.style.cursor = 'default';
                    statusSpan.onclick = null;
                }                
            }

            findingsCell.innerHTML = '';

            if (findings.value && findings.value.length > 0) {
                findings.value.forEach(finding => {
                    const tag = document.createElement('a');
                    tag.target = '_blank';
                    tag.href = `./GHASCodeViewer.html?alertId=${encodeURIComponent(finding.alertId)}&repo=${encodeURIComponent(repoName)}&repoKey=${encodeURIComponent(sanitizedRepoName)}#pat=${encodeURIComponent(currentPat)}`;

                    const type = finding.alertType === 'code' ? 'CODE' : (finding.alertType === 'dependency' ? 'DEPS' : finding.alertType);
                    const state = finding.state === 'active' ? '🔳' : (finding.state === 'fixed' ? '✅' : (finding.state === 'dismissed' ? '❎' : finding.state));
                    const sever = finding.severity === 'high' ? '🟠' : (finding.severity === 'medium' ? '🟡' : (finding.severity === 'low' ? '🟢' : (finding.severity === 'critical' ? '🔴' : finding.severity)));

                    const titleSpan = document.createElement('span');
                    titleSpan.className = 'finding-title';

                    const taxonomy = getPrimarySecurityTagFromRules(finding);
                    const primaryTagPrefix = taxonomy.primary ? `[${taxonomy.primary}] ` : '';
                    titleSpan.textContent = `${state}${sever}${type} ${primaryTagPrefix}${finding.title}`;

                    tag.className = `findings ${finding.severity} ${finding.state}`;
                    tag.appendChild(titleSpan);

                    const taxonomySpan = document.createElement('span');
                    taxonomySpan.className = 'finding-location';
                    taxonomySpan.textContent = `CVE: ${taxonomy.cve.join(', ') || '-'} | CWE: ${taxonomy.cwe.join(', ') || '-'}`;
                    tag.appendChild(taxonomySpan);

                    const locationText = getFindingLocationText(finding);
                    if (locationText) {
                        const locationSpan = document.createElement('span');
                        locationSpan.className = 'finding-location';
                        locationSpan.textContent = locationText;
                        tag.appendChild(locationSpan);
                    }

                    attachCaseInsightHover(tag, finding, taxonomy);

                    findingsCell.appendChild(tag);
                });
            } else {
                findingsCell.textContent = 'No findings found';
            }

            findingsCell.dataset.loaded = '1';
            // This repo's cache (findings + attribution) just changed — invalidate the
            // cross-repo case index so the next hover rebuilds with fresh data.
            invalidateCaseIndex();
        } catch (error) {
            findingsCell.textContent = '';
            const errSpan = document.createElement('span');
            errSpan.style.cssText = 'color:#c0392b;font-size:11px;';
            errSpan.textContent = `Error: ${error.message}`;
            findingsCell.appendChild(errSpan);
            console.error('Error fetching GHAS findings:', error);
        } finally {
            findingsCell.dataset.loading = '0';
        }
    }

    function clearCacheForRepo(sanitizedRepoName) {
        if (window.GHASResult?.clearCacheByPattern) {
            window.GHASResult.clearCacheByPattern(sanitizedRepoName);
        }
    }

    function getFindingLocationText(finding) {
        const location =
            finding?.physicalLocations?.[0] ||
            finding?.physicalLocation?.[0] ||
            finding?.physicalLocation ||
            null;

        if (!location) return '';

        const filePath = location.filePath || location.filepath || '';
        const region = location.region || {};

        const lineStart = Number(region.lineStart ?? region.startLine ?? 0);
        const lineEnd = Number(region.lineEnd ?? region.endLine ?? 0);
        const columnStart = Number(region.columnStart ?? region.startColumn ?? 0);
        const columnEnd = Number(region.columnEnd ?? region.endColumn ?? 0);

        const parts = [];

        if (filePath) {
            parts.push(filePath);
        }

        if (lineStart > 0) {
            const lineText = (lineEnd > 0 && lineEnd !== lineStart)
                ? `line ${lineStart}-${lineEnd}`
                : `line ${lineStart}`;
            parts.push(lineText);
        }

        if (columnStart > 0) {
            const colText = (columnEnd > 0 && columnEnd !== columnStart)
                ? `col ${columnStart}-${columnEnd}`
                : `col ${columnStart}`;
            parts.push(colText);
        }

        return parts.join(', ');
    }

    function getPrimarySecurityTagFromRules(finding) {
        const cve = [];
        const cwe = [];
        const seenCve = new Set();
        const seenCwe = new Set();
        const rawTags = [];

        const pushTags = (v) => {
            if (!v) return;
            if (Array.isArray(v)) {
                rawTags.push(...v);
            } else {
                rawTags.push(v);
            }
        };

        // 1) Preferred shape: finding.tools[].rules[].tag / tags
        if (Array.isArray(finding?.tools)) {
            for (const tool of finding.tools) {
                if (!Array.isArray(tool?.rules)) continue;
                for (const rule of tool.rules) {
                    pushTags(rule?.tag);
                    pushTags(rule?.tags);
                    pushTags(rule?.properties?.tag);
                    pushTags(rule?.properties?.tags);
                }
            }
        }

        // 2) Existing/fallback shapes
        if (Array.isArray(finding?.rules)) {
            for (const rule of finding.rules) {
                pushTags(rule?.tag);
                pushTags(rule?.tags);
                pushTags(rule?.properties?.tag);
                pushTags(rule?.properties?.tags);
            }
        }
        if (finding?.rule && typeof finding.rule === 'object') {
            pushTags(finding.rule?.tag);
            pushTags(finding.rule?.tags);
            pushTags(finding.rule?.properties?.tag);
            pushTags(finding.rule?.properties?.tags);
        }

        // 3) Last fallback
        pushTags(finding?.tags);
        pushTags(finding?.properties?.tags);

        for (const t of rawTags) {
            const text = typeof t === 'string'
                ? t
                : (t?.name || t?.id || t?.value || JSON.stringify(t) || '');

            if (!text) continue;
            const up = text.toUpperCase();

            // supports CVE-2024-1234, CVE_2024_1234, CVE:2024:1234, etc.
            const cveMatches = up.match(/CVE[-_:\s]?(\d{4})[-_:\s]?(\d{4,7})/g) || [];
            const cweMatches = up.match(/CWE[-_:\s]?(\d{1,5})/g) || [];

            for (const m of cveMatches) {
                const n = m.match(/(\d{4}).*?(\d{4,7})/);
                if (!n) continue;
                const id = `CVE-${n[1]}-${n[2]}`;
                if (!seenCve.has(id)) {
                    seenCve.add(id);
                    cve.push(id);
                }
            }

            for (const m of cweMatches) {
                const n = m.match(/(\d{1,5})/);
                if (!n) continue;
                const id = `CWE-${n[1]}`;
                if (!seenCwe.has(id)) {
                    seenCwe.add(id);
                    cwe.push(id);
                }
            }
        }

        const primary = cve[0] || cwe[0] || '';
        return { primary, cve, cwe, rawTags };
    }
    function summarizeFixByDay(findings) {
        const items = Array.isArray(findings) ? findings : [];
        const knownSev = ['critical', 'high', 'medium', 'low'];
        const totalBySev = { critical: 0, high: 0, medium: 0, low: 0 };
        const fixedBySev = { critical: 0, high: 0, medium: 0, low: 0 };
        let allFixed = 0;

        for (const f of items) {
            const state = String(f?.state || '').toLowerCase();
            const sev = String(f?.severity || '').toLowerCase();
            const isFixed = state === 'fixed' || state === 'dismissed';

            if (knownSev.includes(sev)) totalBySev[sev]++;
            if (!isFixed) continue;

            allFixed++;
            if (knownSev.includes(sev)) fixedBySev[sev]++;
        }

        return { allCase: items.length, allFixed, totalBySev, fixedBySev };
    }

    function renderFixSummaryForRow(row, findings, commits) {
        const summaryEl = row?.cells?.[1]?.querySelector('.repo-summary');
        if (!summaryEl) return;

        const s = summarizeFixByDay(findings);
        summaryEl.innerHTML = '';

        const sevConfig = [
            { key: 'critical', label: 'C', color: '#c0392b' },
            { key: 'high',     label: 'H', color: '#e67e22' },
            { key: 'medium',   label: 'M', color: '#2980b9' },
            { key: 'low',      label: 'L', color: '#888888' },
        ];

        const wrapper = document.createElement('div');
        wrapper.className = 'committer-table-wrapper';

        const table = document.createElement('table');
        table.className = 'committer-table';

        // Header: Name | Date | C | H | M | L
        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        [{ label: 'Name', color: null }, { label: 'Date', color: null }, ...sevConfig].forEach(cfg => {
            const th = document.createElement('th');
            th.textContent = cfg.label;
            if (cfg.color) th.style.color = cfg.color;
            headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');

        // Helper: add Total / Fixed summary rows
        function addSummaryRow(label, bySev) {
            const tr = document.createElement('tr');
            tr.className = 'summary-row';

            const nameTd = document.createElement('td');
            nameTd.textContent = label;

            const dateTd = document.createElement('td');
            dateTd.textContent = '-';

            tr.appendChild(nameTd);
            tr.appendChild(dateTd);

            sevConfig.forEach(cfg => {
                const td = document.createElement('td');
                const n = bySev[cfg.key] || 0;
                td.textContent = n > 0 ? String(n) : '-';
                td.style.color = n > 0 ? cfg.color : '#ccc';
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        }

        addSummaryRow('Total', s.totalBySev);
        addSummaryRow('Fixed', s.fixedBySev);

        // Committer rows
        const commitList = Array.isArray(commits) ? commits : [];
        const fixedFindings = findings.filter(f => {
            const s = String(f?.state || '').toLowerCase();
            return s === 'fixed' || s === 'dismissed';
        });

        if (fixedFindings.length > 0 && commitList.length > 0) {
            const byCommitter = window.GHASShared.attributeFixedFindings(fixedFindings, commitList);

            Object.entries(byCommitter)
                .sort(([a], [b]) => a.localeCompare(b))
                .forEach(([name, data]) => {
                    const tr = document.createElement('tr');

                    const nameTd = document.createElement('td');
                    nameTd.textContent = name.slice(0, 10);
                    nameTd.title = name;

                    const dateTd = document.createElement('td');
                    dateTd.textContent = data.latestDate
                        ? data.latestDate.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: '2-digit' })
                        : '-';

                    tr.appendChild(nameTd);
                    tr.appendChild(dateTd);

                    sevConfig.forEach(cfg => {
                        const td = document.createElement('td');
                        const count = data[cfg.key] || 0;
                        td.textContent = count > 0 ? String(count) : '-';
                        td.style.color = count > 0 ? cfg.color : '#ccc';
                        td.style.fontWeight = count > 0 ? 'bold' : 'normal';
                        tr.appendChild(td);
                    });

                    tbody.appendChild(tr);
                });
        }

        table.appendChild(tbody);
        wrapper.appendChild(table);
        summaryEl.appendChild(wrapper);
    }

    async function getCommitsForRepo(repoName, pat) {
        const allRepoData = JSON.parse(allrepojson);
        const match = allRepoData.data.find(r => r.repoName === repoName);
        if (!match) return { value: [], branch: null };
        return window.GHASShared.getCommitsForRepo(organization, match.projectName, repoName, pat);
    }
