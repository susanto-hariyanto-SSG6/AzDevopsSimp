<head>

    <style>
        body {
            margin: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }

        #progressContainer {
            margin-top: 20px;
            width:100%;
            border: 1px solid green;
        }

        #progressBar {
            width: 0%;
            height: 30px;
            background-color: green;
            text-align: center;
            color: white;
            transition: width 0.5s ease-in-out;
            line-height: 30px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            padding-top: 60px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #ddd;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 1rem;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            line-height: 1;
            color: #555;
        }

        .modal-body {
            overflow-y: auto;
            padding: 16px 20px;
        }

        .btn-detail {
            padding: 4px 10px;
            font-size: 0.82rem;
            cursor: pointer;
            border: 1px solid #888;
            border-radius: 4px;
            background: #f7f7f7;
        }

        .btn-detail:hover {
            background: #e0e8f8;
            border-color: #4a7fd4;
        }

        .project-item {
            margin-bottom: 20px;
        }

        .project-item > h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: #333;
        }

        ul li h3 {
            margin-bottom: 10px;
            margin-top: 0;
        }

        ul li {
            margin-top: 15px;
        }

        .repo-container {
            border: 2px solid #ddd;
            border-radius: 6px;
            padding: 12px;
            background-color: #f9f9f9;
            margin-bottom: 10px;
        }

        .repo-item {
            padding: 8px 0;
            padding-left: 12px;
            border-left: 3px solid #4a90e2;
            margin: 6px 0;
            font-size: 0.95rem;
            color: #555;
        }

        .repo-item a {
            /* color: #4a90e2; */
            text-decoration: none;
            font-weight: bold;
            
        }

        .repo-item:last-child {
            margin-bottom: 0;
        }

        .repo-summary-title {
            margin: 10px 0 6px 0;
            font-size: 1rem;
        }

        .repo-empty {
            padding: 12px;
            color: #999;
            font-style: italic;
        }

        .repo-no-data {
            margin-top: 8px;
            color: #666;
            font-style: italic;
        }

        .repo-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .repo-toggle-btn {
            padding: 4px 10px;
            font-size: 0.82rem;
            cursor: pointer;
            border: 1px solid #888;
            border-radius: 4px;
            background: #f7f7f7;
            white-space: nowrap;
        }

        .repo-toggle-btn:hover {
            background: #e0e8f8;
            border-color: #4a7fd4;
        }

        .repo-summary-panel {
            margin-top: 6px;
        }

        .repo-summary-panel.hidden {
            display: none;
        }

        .repo-status-badge {
            display: inline-block;
            margin-top: 4px;
            margin-left: 10px;
            font-size: 0.78rem;
            color: #888;
        }

        .repo-status-badge.fresh {
            color: #28a745;
        }

        .repo-status-badge.cached {
            cursor: pointer;
            color: #e67e22;
        }

        /* .repo-status-badge.cached:hover {
            text-decoration: underline;
        } */

        function buildMonthlyFixedRows(findings) {
            const byMonth = {};

            (findings || []).forEach(finding => {
                if (!hasFixedDate(finding)) return;

                const d = new Date(finding.fixedDate);
                if (Number.isNaN(d.getTime())) return;

                const now = new Date();
                const isWithin30Days = (now - d) <= 30 * 24 * 60 * 60 * 1000;
                const monthKey = isWithin30Days
                    ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
                    : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                const monthLabel = isWithin30Days
                    ? d.toLocaleString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })
                    : d.toLocaleString('id-ID', { month: 'long', year: 'numeric' });

                if (!byMonth[monthKey]) {
                    byMonth[monthKey] = { label: monthLabel, rows: [] };
                }

                byMonth[monthKey].rows.push({
                    title: finding.title || 'N/A',
                    severity: finding.severity || 'N/A',
                    fixedDate: d
                });
            });

            return byMonth;
        }

            // Group findings by (period, committer)
            const now = new Date();
            const grouped = {};

            (findings || []).forEach(finding => {
                if (!hasFixedDate(finding)) return;
                const d = new Date(finding.fixedDate);
                if (isNaN(d.getTime())) return;

                const isWithin30Days = (now - d) <= 30 * 24 * 60 * 60 * 1000;
                const periodKey = isWithin30Days
                    ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
                    : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                const periodLabel = isWithin30Days
                    ? d.toLocaleString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })
                    : d.toLocaleString('id-ID', { month: 'long', year: 'numeric' });

                const closest = findClosestCommitter(finding.fixedDate, commitList);
                const committer = closest?.author?.name || closest?.committer?.name || 'Unknown';

                const groupKey = `${periodKey}\x00${committer}`;

            const groupKeys = Object.keys(grouped).sort();

            if (groupKeys.length === 0) {

                window.__monthDetailData[detailKey] = { label: `${periodLabel} · ${committer}`, rows };
                btn.onclick = () => openModal(detailKey, `${periodLabel} · ${committer} — ${repoName}`);
                actionTd.appendChild(btn);

        async function toggleRepoSummary(projectName, repo, repoContainer, buttonElement) {
            
            const panelElement = repoContainer.querySelector('.repo-summary-panel');
            
            if (!panelElement) return;

            const alreadyLoaded = repoContainer.getAttribute('data-summary-loaded') === '1';
            const isLoadingSummary = repoContainer.getAttribute('data-summary-loading') === '1';

            if (alreadyLoaded) {
                const isHidden = panelElement.classList.contains('hidden');
                panelElement.classList.toggle('hidden', !isHidden);
                buttonElement.textContent = isHidden ? 'Hide Summary' : 'Show Summary';
                return;
            }

            if (isLoadingSummary) return;

            const pat = getCurrentPat();
            if (!pat) {
                alert('PAT is required.');
                return;
            }

            repoContainer.setAttribute('data-summary-loading', '1');
            buttonElement.disabled = true;
            buttonElement.textContent = 'Loading Summary...';

            try {
                const sanitizedRepoName = repo.repoName.replace(/[\s_@#\$%\^&\*!]/g, '-');
                const [findings, commits] = await Promise.all([
                    getGhasResult(PROJECT_ID, pat, sanitizedRepoName),
                    getCommitsForRepo(repo.repoName, pat)
                ]);

                // Store commits for use in detail modal author matching
                window.__repoCommits = window.__repoCommits || {};
                window.__repoCommits[`${projectName}||${repo.repoName}`] = commits.value || [];

                const fromCache = findings.fromCache === true;
                renderRepoSummary(projectName, repo.repoName, findings.value || [], panelElement, commits);
                panelElement.classList.remove('hidden');
                repoContainer.setAttribute('data-summary-loaded', '1');
                buttonElement.textContent = 'Hide Summary';

                const statusBadge = repoContainer.querySelector('.repo-status-badge');
                if (statusBadge) {
                    if (fromCache) {
                        statusBadge.textContent = '🔄 Reload';
                        statusBadge.className = 'repo-status-badge cached';
                        statusBadge.onclick = async () => {
                            if (window.GHASResult.clearCache) await window.GHASResult.clearCache();
                            repoContainer.setAttribute('data-summary-loaded', '0');
                            statusBadge.textContent = '';
                            statusBadge.className = 'repo-status-badge';
                            statusBadge.onclick = null;
                            toggleRepoSummary(projectName, repo, repoContainer, buttonElement);
                        };
                    } else {
                        statusBadge.textContent = '✓ Current Data';
                        statusBadge.className = 'repo-status-badge fresh';
                        statusBadge.onclick = null;
                    }
                }
            } catch (error) {
                panelElement.innerHTML = '';
                const err = document.createElement('div');
                err.className = 'repo-no-data';
                err.textContent = `Failed to load summary: ${error.message}`;
                panelElement.appendChild(err);
                panelElement.classList.remove('hidden');
                buttonElement.textContent = 'Retry Summary';
                console.error('Failed to load per-repo summary:', error);
            } finally {
                repoContainer.setAttribute('data-summary-loading', '0');
                buttonElement.disabled = false;
            }
        }

        async function getGhasResult(projectId, pat, repo) {
            const top = 100;
            let continuationToken = null;
            let page = 0;

            const allFindings = [];
            const seenAlertIds = new Set();
            const seenPageMarkers = new Set();
            let fromCache = false;

            while (true) {

                const params = new URLSearchParams({
                    'api-version': '7.2-preview.1',
                    '$top': String(top)
                });

                if (continuationToken) params.set('continuationToken', continuationToken);

                const url = `https://advsec.dev.azure.com/${organization}/${projectId}/_apis/alert/repositories/${repo}/alerts?${params.toString()}`;
                const { data, headers } = await window.GHASResult.fetchDataWithHeaders(url, pat);

                const isCompactCache = !!(data && data.__compactCache === true);
                if (isCompactCache) {
                    fromCache = true;
                }else{
                    await randomDelay(500, 1500);
                }

                // console.log('[GHASResult] page fetch', {
                //     repo,
                //     page: page + 1,
                //     isCompactCache,
                //     hasContinuation: !!headers.get('x-ms-continuationtoken'),
                //     itemCount: Array.isArray(data?.value) ? data.value.length : 0
                // });

                const items = Array.isArray(data?.value) ? data.value : [];
                const firstId = items[0]?.alertId ?? 'none';
                const marker = `top=${top}|token=${continuationToken ?? 'start'}|firstId=${firstId}|count=${items.length}`;

                page++;
                if (seenPageMarkers.has(marker)) break;
                seenPageMarkers.add(marker);

                let addedThisPage = 0;
                for (const f of items) {
                    const id = String(f?.alertId ?? '');
                    if (!id || seenAlertIds.has(id)) continue;
                    seenAlertIds.add(id);
                    allFindings.push(f);
                    addedThisPage++;
                }

                const nextToken = headers.get('x-ms-continuationtoken');
                if (!nextToken) break;
                if (nextToken === continuationToken) break;
                if (items.length > 0 && addedThisPage === 0) break;

                continuationToken = nextToken;
            }

            // console.log('[GHASResult] done', { repo, total: allFindings.length, fromCache });
            return { value: allFindings, fromCache };
        }

        async function getCommitsForRepo(repoName, pat) {
            try {
                const allRepoData = JSON.parse(allrepojson);
                const match = allRepoData.data.find(r => r.repoName === repoName);
                if (!match) return { value: [], count: 0, branch: null };

                const baseUrl = `https://dev.azure.com/${organization}/${encodeURIComponent(match.projectName)}` +
                    `/_apis/git/repositories/${encodeURIComponent(match.repoName)}/commits`;

                const refsUrl = `https://dev.azure.com/${organization}/${encodeURIComponent(match.projectName)}` +
                    `/_apis/git/repositories/${encodeURIComponent(match.repoName)}/refs?filter=heads/&api-version=7.1-preview.1`;
                let actualBranches = [];
                try {
                    const refsData = await window.GHASResult.fetchData(refsUrl, pat);
                    actualBranches = (refsData?.value || []).map(r => r.name.replace('refs/heads/', ''));
                } catch {}

                const priorityBranches = ['prod', 'production', 'master'];
                for (const priority of priorityBranches) {
                    // Case-insensitive match against actual branch names
                    const actualName = actualBranches.find(b => b.toLowerCase() === priority) ?? priority;
                    try {
                        const params = new URLSearchParams({
                            'api-version': '7.1-preview.1',
                            'searchCriteria.itemVersion.versionType': 'Branch',
                            'searchCriteria.itemVersion.version': actualName
                        });
                        const data = await window.GHASResult.fetchData(`${baseUrl}?${params}`, pat);
                        const commits = Array.isArray(data?.value) ? data.value : [];
                        if (commits.length > 0) {
                            return { value: commits, count: commits.length, branch: actualName };
                        }
                    } catch {}
                }

                // Fallback: no branch filter (default branch)
                const fallback = await window.GHASResult.fetchData(`${baseUrl}?api-version=7.1-preview.1`, pat);
                return {
                    value: Array.isArray(fallback?.value) ? fallback.value : [],
                    count: fallback?.count ?? 0,
                    branch: null
                };
            } catch {
                return { value: [], count: 0, branch: null };
            }
        }

        function findClosestCommitter(fixedDate, commits) {
            if (!commits || commits.length === 0 || !fixedDate) return null;
            const target = new Date(fixedDate).getTime();
            if (isNaN(target)) return null;
            let closest = null;
            let minDiff = Infinity;
            for (const commit of commits) {
                const t = new Date(commit.author?.date || commit.committer?.date).getTime();
                if (isNaN(t)) continue;
                const diff = Math.abs(target - t);
                if (diff < minDiff) { minDiff = diff; closest = commit; }
            }
            return closest;
        }

        function buildDetailTable(detailKey) {
            const monthData = window.__monthDetailData && window.__monthDetailData[detailKey];
            if (!monthData) return document.createTextNode('No data.');

            const { rows } = monthData;

            const table = document.createElement('table');
            table.style.width = '100%';
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>Finding Title</th>
                        <th>Severity</th>
                        <th>Fixed Date</th>
                    </tr>
                </thead>`;
            const tbody = document.createElement('tbody');
            rows.forEach(r => {
                const tr = document.createElement('tr');
                const severityIcon = r.severity === 'high' ? '🟠' :
                                    r.severity === 'medium' ? '🟡' :
                                    r.severity === 'low' ? '🟢' :
                                    r.severity === 'critical' ? '🔴' : '⚪';
                const fixedDateStr = r.fixedDate
                    ? new Date(r.fixedDate).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })
                    : 'N/A';
                tr.innerHTML = `
                    <td>${r.title}</td>
                    <td>${severityIcon} ${r.severity}</td>
                    <td>${fixedDateStr}</td>`;
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            return table;
        }

        function openModal(detailKey, label) {
            
            const monthData = window.__monthDetailData && window.__monthDetailData[detailKey];
            const total = monthData ? monthData.rows.length : 0;

            document.getElementById('modalTitle').textContent = `Detail - ${label} (${total} findings)`;

            const body = document.getElementById('modalBody');
            body.innerHTML = '';
            body.appendChild(buildDetailTable(detailKey));

            document.getElementById('detailModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        async function loadCommits() {

            const pat = getCurrentPat();
            if (!pat) {
                throw new Error('PAT is required.');
            }

            const url =
                `https://dev.azure.com/${organization}/${project.name}` +
                `/_apis/git/repositories/${project.repository}/commits?api-version=7.1-preview.1`;

            const auth = btoa(":" + pat);

            const response = await fetch(url, {
                method: "GET",
                headers: {
                    "Authorization": "Basic " + auth,
                    "Content-Type": "application/json"
                }
            });

            const data = await response.json();

            const tbody = document.getElementById("commitTable");

            tbody.innerHTML = "";

            data.value.forEach(commit => {

                const row = `
                    <tr>
                        <td>-</td>
                        <td>GHAS</td>
                        <td>${project.name}</td>
                        <td>${project.repository}</td>
                        <td>-</td>
                        <td>-</td>
                    </tr>
                `;

                tbody.innerHTML += row;
            });
        }
    </script>
    <script src="./GHASResult.cache.js"></script>
</body>
</html>
