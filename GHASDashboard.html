<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHAS Cluster Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; background: #f4f6f8; color: #333; }

        header { background: #1e2a38; color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        header h1 { margin: 0; font-size: 1.1rem; flex: 1; }
        header input[type=text] { padding: 5px 8px; border-radius: 4px; border: none; font-size: 12px; width: 220px; }
        header button { padding: 5px 12px; border-radius: 4px; border: none; background: #27ae60; color: #fff; cursor: pointer; font-size: 12px; }
        header button:disabled { background: #aaa; cursor: default; }
        #liveStatus { font-size: 11px; color: #adf; }

        .cluster-cards { display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; }

        .cluster-card {
            flex: 1; min-width: 260px;
            background: #fff; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 16px; position: relative;
        }
        .cluster-card h2 { margin: 0 0 10px; font-size: 1rem; color: #1e2a38; }
        .cluster-meta { color: #888; font-size: 11px; margin-bottom: 10px; }

        .sev-row { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
        .sev-chip { padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; color: #fff; }
        .sev-chip.c { background: #c0392b; }
        .sev-chip.h { background: #e67e22; }
        .sev-chip.m { background: #2980b9; }
        .sev-chip.l { background: #888; }

        .fix-bar-wrap { margin-top: 10px; }
        .fix-bar-bg { background: #e8e8e8; border-radius: 4px; height: 10px; width: 100%; overflow: hidden; }
        .fix-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }
        .fix-label { font-size: 11px; color: #555; margin-top: 3px; display: flex; justify-content: space-between; }

        .fix-rate-badge {
            position: absolute; top: 16px; right: 16px;
            width: 48px; height: 48px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 13px; color: #fff;
        }

        .section { padding: 0 16px 20px; }
        .section-header {
            display: flex; align-items: center; gap: 8px;
            cursor: pointer; user-select: none;
            padding: 10px 12px; background: #fff;
            border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            margin-bottom: 4px;
        }
        .section-header:hover { background: #f0f4ff; }
        .section-header h3 { margin: 0; font-size: 0.95rem; flex: 1; }
        .section-toggle { font-size: 14px; color: #888; }

        .project-table-wrap { overflow-x: auto; }
        table.ptable {
            width: 100%; border-collapse: collapse;
            background: #fff; border-radius: 0 0 6px 6px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        table.ptable th {
            background: #f0f4f8; padding: 7px 10px;
            text-align: left; font-size: 11px;
            border-bottom: 2px solid #dce3ea;
            white-space: nowrap;
        }
        table.ptable td { padding: 6px 10px; border-bottom: 1px solid #f0f0f0; font-size: 12px; white-space: nowrap; }
        table.ptable tr:last-child td { border-bottom: none; }
        table.ptable tr:hover td { background: #f9fbff; }
        table.ptable td.num { text-align: right; }

        .c { color: #333; font-weight: bold; }
        .h { color: #333; font-weight: bold; }
        .m { color: #333; font-weight: bold; }
        .l { color: #222; font-weight: bold; }
        .dim { color: #bbb; }

        .rate-pill {
            display: inline-block; padding: 2px 7px;
            border-radius: 10px; font-size: 10px; font-weight: bold; color: #fff;
        }
        .rate-good { background: #27ae60; }
        .rate-mid  { background: #f39c12; }
        .rate-low  { background: #e74c3c; }

        .live-badge { font-size: 9px; background: #27ae60; color: #fff; padding: 1px 5px; border-radius: 8px; margin-left: 4px; vertical-align: middle; }
        .stale-badge { font-size: 9px; background: #aaa; color: #fff; padding: 1px 5px; border-radius: 8px; margin-left: 4px; vertical-align: middle; }
        .repo-refresh-btn { font-size: 10px; padding: 1px 5px; margin-left: 5px; border: 1px solid #b0c4de; border-radius: 3px; background: #eaf3ff; color: #2471a3; cursor: pointer; vertical-align: middle; }
        .repo-refresh-btn:disabled { color: #aaa; cursor: default; background: #f5f5f5; border-color: #ddd; }

        .hidden { display: none; }

        /* Programmer attribution table */
        .prog-section { margin-top: 8px; }
        .prog-section-header {
            display: flex; align-items: center; gap: 10px;
            padding: 7px 12px; background: #f8f0ff;
            border-radius: 6px 6px 0 0; border-bottom: 1px solid #e0d0f0;
            font-size: 12px; font-weight: 600; color: #6c3483;
        }
        .prog-section-header button {
            padding: 3px 10px; border-radius: 4px; border: none;
            background: #8e44ad; color: #fff; cursor: pointer; font-size: 11px;
        }
        .prog-section-header button:disabled { background: #bbb; cursor: default; }
        .prog-status { font-size: 11px; color: #8e44ad; margin-left: 6px; }
        table.prog-table {
            width: 100%; border-collapse: collapse;
            background: #fff; border-radius: 0 0 6px 6px;
            overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        table.prog-table th {
            background: #f3eaff; padding: 6px 10px;
            text-align: left; font-size: 11px;
            border-bottom: 2px solid #e0d0f0; white-space: nowrap;
        }
        table.prog-table td { padding: 5px 10px; border-bottom: 1px solid #f5f0ff; font-size: 12px; white-space: nowrap; }
        table.prog-table tr:last-child td { border-bottom: none; }
        table.prog-table tr:hover td { background: #fdf6ff; }
        table.prog-table td.num { text-align: right; }

        /* Debug panel */
        #debugPanel { background: #1a1a2e; color: #e0e0e0; padding: 14px 20px; font-size: 12px; border-top: 2px solid #e74c3c; }
        #debugPanel summary { cursor: pointer; font-weight: bold; color: #f39c12; font-size: 13px; }
        #debugPanel input[type=text] { padding: 4px 8px; border-radius: 4px; border: none; font-size: 12px; width: 280px; background: #2d2d44; color: #fff; }
        #debugPanel button { padding: 4px 10px; border-radius: 4px; border: none; background: #e74c3c; color: #fff; cursor: pointer; font-size: 12px; margin-left: 6px; }
        #debugOut { margin-top: 10px; white-space: pre-wrap; font-family: monospace; font-size: 11px; max-height: 400px; overflow-y: auto; background: #12121e; padding: 10px; border-radius: 4px; }
        #debugOut .ok { color: #2ecc71; } #debugOut .warn { color: #f39c12; } #debugOut .err { color: #e74c3c; }
        #debugOut .head { color: #74b9ff; font-weight: bold; }
    </style>
    <!-- Chart library for line charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<header>
    <h1>🛡 GHAS Cluster Dashboard</h1>
    <input type="text" id="patInput" placeholder="Enter PAT for live data (optional)" />
    <button id="loadLiveBtn" onclick="loadLiveData()">Load Live Data</button>
    <button onclick="clearAllCache()" style="background:#c0392b;">Clear Cache</button>
    <span id="liveStatus"></span>
</header>

<div class="cluster-cards" id="clusterCards">
    <div style="padding:20px;color:#888;">Loading clusters…</div>
</div>

<div id="fixingActivityContainer" style="display:none;"></div>

<div id="clusterSections"></div>

<details id="debugPanel">
    <summary>🔍 Debug: Repo Inspector</summary>
    <div style="margin-top:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <input type="text" id="debugRepo" placeholder="Repo name e.g. SSG5-C1-BSQWebAPI" value="SSG5-C1-BSQWebAPI" />
        <button onclick="runDebug()">Inspect</button>
        <button onclick="viewRawCache()">View Raw</button>
        <button onclick="clearRepoCache()" style="background:#c0392b;">Clear Cache</button>
        <span id="debugStatus" style="font-size:11px;color:#adf"></span>
    </div>
    <div style="margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <span style="color:#aaa;font-size:11px;">Raw API test — extra param:</span>
        <input type="text" id="debugExtraParam" style="width:320px" placeholder="e.g. states=active,fixed  or  criteria.states=fixed  (leave blank for default)" />
        <button onclick="runRawTest()" style="background:#8e44ad;">Test Raw API</button>
    </div>
    <div id="debugOut"></div>
</details>

<script>
    const organization = 'itbinus';
    const GHAS_PROJECT_ID = '1f663eb2-dd63-4b51-b000-f0949e3c8ab0';

    // FNV-1a hash for PAT obfuscation (same as GHASResult.html)
    function hash(s) {
        let h = 2166136261;
        for (let i = 0; i < s.length; i++) {
            h ^= s.charCodeAt(i);
            h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
        }
        return (h >>> 0).toString(36);
    }

    // dismissed counts as resolved (same as fixed) throughout this dashboard
    const isResolved = f => { const s = String(f?.state||'').toLowerCase(); return s === 'fixed' || s === 'dismissed'; };

    // Base fetch functions — must be registered on window.GHASResult BEFORE cache.js loads
    // These are the fallback implementations. cache.js will wrap them with IndexedDB caching.
    // IMPORTANT: Keep implementations identical to GHASResult.html so both pages use same cache
    async function fetchData(url, pat) {
        const response = await fetch(url, { 
            method: 'GET',
            headers: { 'Authorization': 'Basic ' + btoa(':' + pat) } 
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
    }

    async function fetchDataWithHeaders(url, pat) {
        const response = await fetch(url, { 
            method: 'GET',
            headers: { 'Authorization': 'Basic ' + btoa(':' + pat) } 
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        return { data, headers: response.headers };
    }

    window.GHASResult = window.GHASResult || {};
    window.GHASResult.fetchData = fetchData;
    window.GHASResult.fetchDataWithHeaders = fetchDataWithHeaders;

    const sevConfig = [
        { key: 'critical', label: 'C', css: 'c', risk: 'criticalRisk' },
        { key: 'high',     label: 'H', css: 'h', risk: 'highRisk'     },
        { key: 'medium',   label: 'M', css: 'm', risk: 'mediumRisk'   },
        { key: 'low',      label: 'L', css: 'l', risk: 'lowRisk'      },
    ];

    let clusterMap = [];   // from GHASCluster.json
    let liveData = {};     // sanitized repoName -> { critical, high, medium, low, totalActive, fixedCritical, fixedHigh, fixedMedium, fixedLow, totalFixed, fromCache }
    const sanitize = n => String(n).replace(/[\s_@#$%^&*!]/g, '-');

    // loadFromCache is called in init() AFTER cache.js loads, so getAllCacheEntries is available
    async function loadFromCache() {
        const alertPat = /_apis\/alert\/repositories\/([^?\/]+)\/alerts/;
        try {
            const entries = await window.GHASResult.getAllCacheEntries();
            const now = Date.now();

            // Multiple IDB entries can exist per repo (different PAT hashes).
            // Collect all valid entries per repo, then use only the FRESHEST one.
            const freshestByRepo = {}; // repoName -> { ts, findings }
            for (const { key, data: entry } of entries) {
                const urlPart = key.slice('ghas:'.length).split('|u:')[0];
                const match = urlPart.match(alertPat);
                if (!match) continue;
                const repoName = decodeURIComponent(match[1]);
                if (!entry?.payload?.value) continue;
                const expired = entry.exp ? now > entry.exp : (now - (entry.ts||0) > 2*24*60*60*1000);
                if (expired) continue;
                const entryTs = entry.ts || 0;
                if (!freshestByRepo[repoName] || entryTs > freshestByRepo[repoName].ts) {
                    freshestByRepo[repoName] = { ts: entryTs, findings: entry.payload.value };
                }
            }

            for (const [repoName, { findings }] of Object.entries(freshestByRepo)) {
                const act = { critical:0, high:0, medium:0, low:0 };
                const fix = { critical:0, high:0, medium:0, low:0 };
                for (const f of findings) {
                    const sev = String(f?.severity||'').toLowerCase();
                    if (isResolved(f)) { if (fix[sev]!==undefined) fix[sev]++; }
                    else               { if (act[sev]!==undefined) act[sev]++; }
                }
                liveData[repoName] = {
                    critical: act.critical, high: act.high, medium: act.medium, low: act.low,
                    totalActive: act.critical+act.high+act.medium+act.low,
                    fixedCritical: fix.critical, fixedHigh: fix.high, fixedMedium: fix.medium, fixedLow: fix.low,
                    totalFixed: fix.critical+fix.high+fix.medium+fix.low,
                    fromCache: true
                };
            }
        } catch(e) {
            console.warn('[Dashboard] loadFromCache error', e);
        }
    }

    function rateColor(pct) {
        if (pct >= 40) return '#27ae60';
        if (pct >= 20) return '#f39c12';
        return '#e74c3c';
    }

    function ratePill(pct) {
        const cls = pct >= 40 ? 'rate-good' : (pct >= 20 ? 'rate-mid' : 'rate-low');
        return `<span class="rate-pill ${cls}">${pct.toFixed(0)}%</span>`;
    }

    // active = open findings, fixed = all-time fixed → denominator is all-time total
    function fixRate(active, fixed) {
        const total = active + fixed;
        return total > 0 ? (fixed / total * 100) : 0;
    }

    // ── Committer attribution helpers ─────────────────────────────────────────

    function findProjectForRepo(repoName) {
        if (!window.__clusters) return repoName;
        const san = sanitize(repoName);
        for (const cl of window.__clusters) {
            for (const p of cl.projects) {
                const repos = Array.isArray(p.repos) ? p.repos : [p.repos || p.name];
                if (repos.some(r => sanitize(r) === san || r === repoName)) return p.name;
            }
        }
        return repoName;
    }

    async function getFixedFindingsFromCache(repos) {
        const alertPat = /_apis\/alert\/repositories\/([^?\/]+)\/alerts/;
        const repoSet = new Set(repos.map(r => sanitize(r)));
        // Use Maps keyed by alertId to deduplicate across multiple IDB entries for same repo
        // (e.g. if repo was fetched with two different PATs → two IDB keys, same findings).
        // Also track freshest ts per repo so we only keep the most recent entry's data.
        const freshestTs = {};  // repoName -> highest ts seen
        const resultMaps = {}; // repoName -> Map<alertId, finding>
        try {
            const entries = await window.GHASResult.getAllCacheEntries();
            const now = Date.now();
            for (const { key, data: entry } of entries) {
                const urlPart = key.slice('ghas:'.length).split('|u:')[0];
                const match = urlPart.match(alertPat);
                if (!match) continue;
                const repoName = decodeURIComponent(match[1]);
                if (!repoSet.has(repoName)) continue;
                if (!entry?.payload?.value) continue;
                const expired = entry.exp ? now > entry.exp : (now - (entry.ts||0) > 2*24*60*60*1000);
                if (expired) continue;
                const entryTs = entry.ts || 0;
                // If we already have a fresher entry for this repo, skip this one
                if (freshestTs[repoName] !== undefined && entryTs < freshestTs[repoName]) continue;
                if (entryTs > (freshestTs[repoName] ?? -1)) {
                    // Fresher entry: reset the map
                    freshestTs[repoName] = entryTs;
                    resultMaps[repoName] = new Map();
                }
                for (const f of entry.payload.value.filter(isResolved)) {
                    const id = String(f?.alertId ?? '');
                    if (id) resultMaps[repoName].set(id, f);
                }
            }
        } catch(e) { console.warn('[Dashboard] getFixedFindingsFromCache', e); }
        return Object.fromEntries(
            Object.entries(resultMaps).map(([k, m]) => [k, [...m.values()]])
        );
    }

    async function buildCommitterData(projects, pat, onProgress) {
        const allRepos = projects.flatMap(p => p.repos);
        const fixedByRepo = await getFixedFindingsFromCache(allRepos);
        const merged = {}; // name -> { weeks:[{weekStart,label,c,h,m,l}×4], older:{label,c,h,m,l} }
        let done = 0;
        for (const r of allRepos) {
            const key = sanitize(r);
            const fixedFindings = fixedByRepo[key] || [];
            if (fixedFindings.length > 0) {
                onProgress?.(`Fetching commits: ${r} (${done + 1}/${allRepos.length})`);
                const projectName = findProjectForRepo(r);
                const { value: commits } = await window.GHASShared.getCommitsForRepo(organization, projectName, r, pat);
                await randomDelay(300, 800);
                 
                // Enrich findings with attribution
                try {
                    const enriched = await window.GHASShared.enrichCacheWithAttribution(
                        fixedFindings,
                        organization,
                        projectName,
                        r,
                        pat
                    );
                    console.log(`[GHASDashboard] ✓ Enriched ${enriched.length} findings for ${r}`);
                     
                    // Save enriched findings back to cache
                    // Find all cache keys for this repo and update them with attribution
                    if (window.GHASResult?.getAllCacheEntries && window.GHASResult?.updateCacheWithAttribution) {
                        const allEntries = await window.GHASResult.getAllCacheEntries();
                        const alertPat = /_apis\/alert\/repositories\/([^?\/]+)\/alerts/;
                        const repoKeysToUpdate = [];
                         
                        for (const { key, data: entry } of allEntries) {
                            const urlPart = key.slice('ghas:'.length).split('|u:')[0];
                            const match = urlPart.match(alertPat);
                            if (!match) continue;
                            const repoName = decodeURIComponent(match[1]);
                            if (sanitize(repoName) === sanitize(r)) {
                                repoKeysToUpdate.push(key);
                            }
                        }
                         
                        console.log(`[GHASDashboard] Found ${repoKeysToUpdate.length} cache keys for ${r}`);
                        for (const key of repoKeysToUpdate) {
                            const success = await window.GHASResult.updateCacheWithAttribution(key, enriched);
                            console.log(`[GHASDashboard] Updated key ${key.substring(0, 70)}...: ${success ? '✓' : '✗'}`);
                        }
                    }
                } catch (enrichError) {
                    console.warn(`[GHASDashboard] Attribution enrichment failed for ${r}:`, enrichError.message);
                }
                 
                const byCommitter = window.GHASShared.attributeFixedFindingsByWeek(fixedFindings, commits);
                for (const [name, d] of Object.entries(byCommitter)) {
                    if (!merged[name]) {
                        merged[name] = {
                            weeks: d.weeks.map(w => ({ weekStart: w.weekStart, label: w.label, critical:0, high:0, medium:0, low:0 })),
                            older: { label: d.older.label, critical:0, high:0, medium:0, low:0 }
                        };
                    }
                    d.weeks.forEach((w, i) => {
                        merged[name].weeks[i].critical += w.critical;
                        merged[name].weeks[i].high     += w.high;
                        merged[name].weeks[i].medium   += w.medium;
                        merged[name].weeks[i].low      += w.low;
                    });
                    merged[name].older.critical += d.older.critical;
                    merged[name].older.high     += d.older.high;
                    merged[name].older.medium   += d.older.medium;
                    merged[name].older.low      += d.older.low;
                }
            }
            done++;
        }
        return merged;
    }

    // Build project list from GHASCluster.json project definitions (each has .name + .repos[])
    function aggregateProjects(projectDefs) {
        return projectDefs.map(p => ({
            projectName: p.name,
            repos: Array.isArray(p.repos) ? p.repos : [p.repos || p.name]
        })).sort((a, b) => {
            const aActive = a.repos.reduce((s,r) => s + (liveData[sanitize(r)]?.totalActive||0), 0);
            const bActive = b.repos.reduce((s,r) => s + (liveData[sanitize(r)]?.totalActive||0), 0);
            return bActive - aActive;
        });
    }

    function clusterTotals(projectList) {
        const acc = { repos: 0, critical: 0, high: 0, medium: 0, low: 0, total: 0, fixed: 0 };
        for (const p of projectList) {
            acc.repos += p.repos.length;
            for (const r of p.repos) {
                const ld = liveData[sanitize(r)];
                if (!ld) continue;
                acc.critical += ld.critical || 0;
                acc.high     += ld.high     || 0;
                acc.medium   += ld.medium   || 0;
                acc.low      += ld.low      || 0;
                acc.total    += ld.totalActive || 0;
                acc.fixed    += ld.totalFixed  || 0;
            }
        }
        return acc;
    }

    function renderClusterCards(clusters) {
        const cards = document.getElementById('clusterCards');
        cards.innerHTML = '';
        for (const cl of clusters) {
            const t = cl._totals;
            const pct = fixRate(t.total, t.fixed);
            const color = rateColor(pct);

            const card = document.createElement('div');
            card.className = 'cluster-card';
            card.innerHTML = `
                <div class="fix-rate-badge" style="background:${color}">${pct.toFixed(0)}%</div>
                <h2>${cl.name}</h2>
                <div class="cluster-meta">${cl._projects.length} projects &nbsp;·&nbsp; ${t.repos} repos</div>
                <div style="font-size:11px;color:#666;margin-bottom:2px;">Total cases: <b>${t.total.toLocaleString()}</b></div>
                <div class="sev-row">
                    <span class="sev-chip c" title="Critical">${t.critical.toLocaleString()}</span>
                    <span class="sev-chip h" title="High">${t.high.toLocaleString()}</span>
                    <span class="sev-chip m" title="Medium">${t.medium.toLocaleString()}</span>
                    <span class="sev-chip l" title="Low">${t.low.toLocaleString()}</span>
                </div>
                <div style="font-size:11px;color:#666;margin-top:8px;margin-bottom:2px;">
                    Active: <b>${t.total.toLocaleString()}</b> &nbsp;·&nbsp; Fixed: <b>${t.fixed.toLocaleString()}</b>
                </div>
                <div class="fix-bar-wrap">
                    <div class="fix-bar-bg"><div class="fix-bar-fill" style="width:${Math.min(pct,100)}%;background:${color}"></div></div>
                    <div class="fix-label"><span>0%</span><span>Fix rate: ${pct.toFixed(1)}% of ${(t.total+t.fixed).toLocaleString()} all-time</span><span>100%</span></div>
                </div>`;
            cards.appendChild(card);
        }
    }

    function renderProjectTable(projects, sectionEl, clusterId) {
        const wrap = document.createElement('div');
        wrap.className = 'project-table-wrap';

        const table = document.createElement('table');
        table.className = 'ptable';

        table.innerHTML = `
        <thead>
          <tr>
            <th rowspan="2">Repo</th>
            <th rowspan="2">Project</th>
            <th colspan="5" style="text-align:center;border-bottom:1px solid #ccc;background:#fdecea">Active</th>
            <th colspan="5" style="text-align:center;border-bottom:1px solid #ccc;background:#eafaf1">Fixed</th>
            <th rowspan="2">Fix%</th>
          </tr>
          <tr>
            <th style="color:#c0392b;text-align:right;background:#fdecea">Crit</th>
            <th style="color:#e67e22;text-align:right;background:#fdecea">High</th>
            <th style="color:#2980b9;text-align:right;background:#fdecea">Med</th>
            <th style="color:#888;text-align:right;background:#fdecea">Low</th>
            <th style="text-align:right;background:#fdecea">#</th>
            <th style="color:#c0392b;text-align:right;background:#eafaf1">Crit</th>
            <th style="color:#e67e22;text-align:right;background:#eafaf1">High</th>
            <th style="color:#2980b9;text-align:right;background:#eafaf1">Med</th>
            <th style="color:#888;text-align:right;background:#eafaf1">Low</th>
            <th style="text-align:right;background:#eafaf1">#</th>
          </tr>
        </thead>`;

        const tbody = document.createElement('tbody');

        // ── Totals row (appended last, but referenced in closures below) ──────
        const tfoot = document.createElement('tr');
        tfoot.style.background = '#f0f4f8';

        function computeTotals() {
            const t = { ac:0,ah:0,am:0,al:0,atotal:0,fc:0,fh:0,fm:0,fl:0,ftotal:0 };
            for (const p of projects) {
                for (const r of p.repos) {
                    const ld = liveData[sanitize(r)];
                    if (!ld) continue;
                    t.ac += ld.critical||0;       t.ah += ld.high||0;
                    t.am += ld.medium||0;         t.al += ld.low||0;
                    t.atotal += ld.totalActive||0;
                    t.fc += ld.fixedCritical||0;  t.fh += ld.fixedHigh||0;
                    t.fm += ld.fixedMedium||0;    t.fl += ld.fixedLow||0;
                    t.ftotal += ld.totalFixed||0;
                }
            }
            return t;
        }

        function renderTotalsRow() {
            const t = computeTotals();
            const pct = fixRate(t.atotal, t.ftotal);
            tfoot.innerHTML = `
                <td><b>TOTAL</b></td><td></td>
                <td class="num c" style="background:#fdecea">${t.ac||'-'}</td>
                <td class="num h" style="background:#fdecea">${t.ah||'-'}</td>
                <td class="num m" style="background:#fdecea">${t.am||'-'}</td>
                <td class="num l" style="background:#fdecea">${t.al||'-'}</td>
                <td class="num" style="background:#fdecea"><b>${t.atotal.toLocaleString()}</b></td>
                <td class="num c" style="background:#eafaf1">${t.fc||'-'}</td>
                <td class="num h" style="background:#eafaf1">${t.fh||'-'}</td>
                <td class="num m" style="background:#eafaf1">${t.fm||'-'}</td>
                <td class="num l" style="background:#eafaf1">${t.fl||'-'}</td>
                <td class="num" style="background:#eafaf1"><b>${t.ftotal.toLocaleString()}</b></td>
                <td class="num">${ratePill(pct)}</td>`;

        // ── Per-repo row filler (called on init and after each refresh) ───────
        function fillRepoRow(tr, r, projectName) {
            const key = sanitize(r);
            const ld  = liveData[key];
            tr.innerHTML = '';

            // Cell 0: repo name + source badge + refresh button
            const td0 = document.createElement('td');
            td0.style.whiteSpace = 'nowrap';
            td0.appendChild(document.createTextNode(r + ' '));
            const badge = document.createElement('span');
            if (!ld) {
                badge.className = 'stale-badge'; badge.title = 'No data'; badge.textContent = '⚠';
            } else if (ld.fromCache) {
                badge.className = 'stale-badge'; badge.textContent = '📦';
            } else {
                badge.className = 'live-badge'; badge.textContent = '🌐';
            }
            td0.appendChild(badge);

            const btn = document.createElement('button');
            btn.className = 'repo-refresh-btn';
            btn.title = `Refresh ${r} from API`;
            btn.textContent = '↺';
            btn.onclick = async () => {
                const pat = document.getElementById('patInput').value.trim();
                if (!pat) {
                    btn.textContent = '⚠'; btn.style.color = '#e74c3c';
                    setTimeout(() => { btn.textContent = '↺'; btn.style.color = ''; }, 2500);
                    return;
                }
                btn.disabled = true; btn.textContent = '⏳';
                await window.GHASResult.clearCacheByPattern(key);
                try {
                    const result = await getGhasResult(GHAS_PROJECT_ID, pat, key);
                    const findings = result.value || [];
                    const act = {critical:0,high:0,medium:0,low:0};
                    const fix = {critical:0,high:0,medium:0,low:0};
                    for (const f of findings) {
                        const s = String(f?.severity||'').toLowerCase();
                        if (isResolved(f)) { if (fix[s]!==undefined) fix[s]++; }
                        else               { if (act[s]!==undefined) act[s]++; }
                    }
                    liveData[key] = {
                        critical: act.critical, high: act.high, medium: act.medium, low: act.low,
                        totalActive: act.critical+act.high+act.medium+act.low,
                        fixedCritical: fix.critical, fixedHigh: fix.high, fixedMedium: fix.medium, fixedLow: fix.low,
                        totalFixed: fix.critical+fix.high+fix.medium+fix.low,
                        fromCache: false
                    };
                    fillRepoRow(tr, r, projectName);   // re-render this row
                    renderTotalsRow();                  // update table totals
                    // update cluster _totals and re-render cards
                    const cl = window.__clusters?.find(c => String(c.id) === String(clusterId));
                    if (cl) cl._totals = clusterTotals(cl._projects);
                    renderClusterCards(window.__clusters);
                } catch(e) {
                    console.warn('[Dashboard] refresh failed:', r, e);
                    btn.disabled = false; btn.textContent = '✗'; btn.style.color = '#e74c3c';
                    setTimeout(() => { btn.textContent = '↺'; btn.style.color = ''; btn.disabled = false; }, 3000);
                }
            };
            td0.appendChild(btn);
            tr.appendChild(td0);

            // Cell 1: project name
            const td1 = document.createElement('td');
            td1.className = 'dim'; td1.style.fontSize = '11px';
            td1.textContent = projectName;
            tr.appendChild(td1);

            // Data cells helper
            const n = v => v > 0 ? String(v) : '-';
            const numTd = (val, cls, bg) => {
                const td = document.createElement('td');
                td.className = `num ${val > 0 ? cls : 'dim'}`;
                td.style.background = bg;
                td.textContent = n(val);
                return td;
            };

            if (ld) {
                tr.appendChild(numTd(ld.critical,      'c', '#fdecea'));
                tr.appendChild(numTd(ld.high,          'h', '#fdecea'));
                tr.appendChild(numTd(ld.medium,        'm', '#fdecea'));
                tr.appendChild(numTd(ld.low,           'l', '#fdecea'));
                const tdAt = document.createElement('td');
                tdAt.className = 'num'; tdAt.style.background = '#fdecea';
                tdAt.innerHTML = `<b>${ld.totalActive.toLocaleString()}</b>`;
                tr.appendChild(tdAt);
                tr.appendChild(numTd(ld.fixedCritical||0, 'c', '#eafaf1'));
                tr.appendChild(numTd(ld.fixedHigh||0,     'h', '#eafaf1'));
                tr.appendChild(numTd(ld.fixedMedium||0,   'm', '#eafaf1'));
                tr.appendChild(numTd(ld.fixedLow||0,      'l', '#eafaf1'));
                const tdFt = document.createElement('td');
                tdFt.className = 'num'; tdFt.style.background = '#eafaf1';
                tdFt.innerHTML = `<b>${ld.totalFixed.toLocaleString()}</b>`;
                tr.appendChild(tdFt);
                const tdPct = document.createElement('td');
                tdPct.className = 'num';
                tdPct.innerHTML = ratePill(fixRate(ld.totalActive, ld.totalFixed));
                tr.appendChild(tdPct);
            } else {
                for (let i = 0; i < 5; i++) { const td = document.createElement('td'); td.className='num dim'; td.style.background='#fdecea'; td.textContent='-'; tr.appendChild(td); }
                for (let i = 0; i < 5; i++) { const td = document.createElement('td'); td.className='num dim'; td.style.background='#eafaf1'; td.textContent='-'; tr.appendChild(td); }
                const td = document.createElement('td'); td.className='num dim'; td.textContent='-'; tr.appendChild(td);
            }
        }

        // ── Build rows ────────────────────────────────────────────────────────
        for (const p of projects) {
            for (const r of p.repos) {
                const tr = document.createElement('tr');
                fillRepoRow(tr, r, p.projectName);
                tbody.appendChild(tr);
            }
        }

        renderTotalsRow();
        tbody.appendChild(tfoot);
        table.appendChild(tbody);
        wrap.appendChild(table);
        sectionEl.appendChild(wrap);
    }

    function renderCommitterSection(projects, bodyEl, clusterId) {
        const wrap = document.createElement('div');
        wrap.className = 'prog-section';

        const hdr = document.createElement('div');
        hdr.className = 'prog-section-header';

        const statusSpan = document.createElement('span');
        statusSpan.className = 'prog-status';

        const tableWrap = document.createElement('div');
        tableWrap.style.overflowX = 'auto';

        const btn = document.createElement('button');
        btn.textContent = '👤 Load Attribution';
        btn.onclick = async () => {
            const pat = document.getElementById('patInput').value.trim();
            if (!pat) { statusSpan.textContent = '⚠ Enter PAT first'; return; }
            btn.disabled = true;
            btn.textContent = '⏳ Loading…';
            statusSpan.textContent = '';

            const byCommitter = await buildCommitterData(projects, pat, msg => {
                statusSpan.textContent = msg;
            });
            statusSpan.textContent = '';
            tableWrap.innerHTML = '';

            const entries = Object.entries(byCommitter).sort(([, a], [, b]) => {
                const score = d => d.weeks.reduce((s, w) => s + w.critical*8+w.high*4+w.medium*2+w.low, 0)
                                   + d.older.critical*8 + d.older.high*4 + d.older.medium*2 + d.older.low;
                return score(b) - score(a);
            });

            if (entries.length === 0) {
                tableWrap.innerHTML = '<div style="padding:10px;color:#888;font-size:12px;">No fixed findings with committer data found in cache.</div>';
                btn.textContent = '↺ Reload Attribution';
                btn.disabled = false;
                return;
            }

            const table = document.createElement('table');
            table.className = 'prog-table';
            table.innerHTML = `
              <thead>
                <tr>
                  <th>Programmer</th>
                  <th>Week</th>
                  <th style="color:#c0392b;text-align:right">Crit</th>
                  <th style="color:#e67e22;text-align:right">High</th>
                  <th style="color:#2980b9;text-align:right">Med</th>
                  <th style="color:#888;text-align:right">Low</th>
                  <th style="text-align:right">Total</th>
                </tr>
              </thead>`;

            const tbody = document.createElement('tbody');
            const grandTotal = { critical:0, high:0, medium:0, low:0 };
            const n = (v, color) => v > 0
                ? `<td class="num" style="color:${color};font-weight:bold">${v}</td>`
                : `<td class="num dim">-</td>`;

            for (const [name, d] of entries) {
                // Collect non-empty rows: weeks 0-3 + older
                const rows = [];
                for (const w of d.weeks) {
                    const tot = w.critical + w.high + w.medium + w.low;
                    if (tot > 0) rows.push({ label: w.label, ...w });
                }
                const oldTot = d.older.critical + d.older.high + d.older.medium + d.older.low;
                if (oldTot > 0) rows.push({ label: d.older.label, ...d.older });
                if (rows.length === 0) continue;

                rows.forEach((row, idx) => {
                    const tr = document.createElement('tr');
                    // Subtle top border to separate programmers
                    if (idx === 0) tr.style.borderTop = '2px solid #e0d0f0';
                    const total = row.critical + row.high + row.medium + row.low;

                    let nameCell = '';
                    if (idx === 0) {
                        // rowspan covers all rows for this programmer
                        nameCell = `<td rowspan="${rows.length}" style="vertical-align:top;padding-top:8px;font-weight:600;max-width:130px;overflow:hidden;text-overflow:ellipsis" title="${name}">${name.length > 20 ? name.slice(0,20)+'…' : name}</td>`;
                    }
                    tr.innerHTML = `${nameCell}
                      <td style="color:#555;font-size:11px">${row.label}</td>
                      ${n(row.critical,'#c0392b')}${n(row.high,'#e67e22')}${n(row.medium,'#2980b9')}${n(row.low,'#888')}
                      <td class="num"><b>${total}</b></td>`;
                    tbody.appendChild(tr);

                    grandTotal.critical += row.critical; grandTotal.high += row.high;
                    grandTotal.medium   += row.medium;   grandTotal.low  += row.low;
                });
            }

            // Grand total row
            const grand = grandTotal.critical + grandTotal.high + grandTotal.medium + grandTotal.low;
            const tfoot = document.createElement('tr');
            tfoot.style.background = '#f3eaff';
            tfoot.innerHTML = `
              <td><b>TOTAL</b></td><td></td>
              <td class="num c">${grandTotal.critical||'-'}</td>
              <td class="num h">${grandTotal.high||'-'}</td>
              <td class="num m">${grandTotal.medium||'-'}</td>
              <td class="num l">${grandTotal.low||'-'}</td>
              <td class="num"><b>${grand}</b></td>`;
            tbody.appendChild(tfoot);
            table.appendChild(tbody);
            tableWrap.appendChild(table);

            btn.textContent = '↺ Reload Attribution';
            btn.disabled = false;
        };

        hdr.innerHTML = `<span>👤 Programmer Attribution</span>`;
        hdr.appendChild(btn);
        hdr.appendChild(statusSpan);
        wrap.appendChild(hdr);
        wrap.appendChild(tableWrap);
        bodyEl.appendChild(wrap);
    }

    function randomDelay(minMs = 500, maxMs = 2000) {
        const delay = Math.random() * (maxMs - minMs) + minMs;
        return new Promise(resolve => setTimeout(resolve, delay));
    }

    async function getGhasResult(projectId, pat, repo) {
        const top = 100;
        let continuationToken = null;
        let page = 0;
        const allFindings = [];
        const seenAlertIds = new Set();
        const seenPageMarkers = new Set();
        let fromCache = false;

        while (true) {
            const params = new URLSearchParams({ 'api-version': '7.2-preview.1', '$top': String(top) });
            if (continuationToken) params.set('continuationToken', continuationToken);
            const url = `https://advsec.dev.azure.com/${organization}/${projectId}/_apis/alert/repositories/${repo}/alerts?${params.toString()}`;
            
            console.log(`[getGhasResult] Fetching page ${page + 1}, token: ${continuationToken ? 'cont' : 'start'}`);
            const { data, headers } = await window.GHASResult.fetchDataWithHeaders(url, pat);

            const isCompactCache = !!(data && data.__compactCache === true);
            if (isCompactCache) {
                fromCache = true;
                console.log(`[getGhasResult] 📦 PAGE ${page + 1} FROM CACHE (compacted format, ${data?.value?.length || 0} items)`);
            } else {
                console.log(`[getGhasResult] 🌐 PAGE ${page + 1} FROM API (fresh data, ${data?.value?.length || 0} items)`);
                await randomDelay(500, 1500);
            }

            const items = Array.isArray(data?.value) ? data.value : [];
            const firstId = items[0]?.alertId ?? 'none';
            const marker = `top=${top}|token=${continuationToken ?? 'start'}|firstId=${firstId}|count=${items.length}`;

            page++;
            if (seenPageMarkers.has(marker)) {
                console.log(`[getGhasResult] Marker already seen, breaking pagination loop`);
                break;
            }
            seenPageMarkers.add(marker);

            let addedThisPage = 0;
            for (const f of items) {
                const id = String(f?.alertId ?? '');
                if (!id || seenAlertIds.has(id)) continue;
                seenAlertIds.add(id);
                allFindings.push(f);
                addedThisPage++;
            }

            const nextToken = headers.get('x-ms-continuationtoken');
            if (!nextToken) {
                console.log(`[getGhasResult] No continuation token, ending pagination`);
                break;
            }
            if (nextToken === continuationToken) {
                console.log(`[getGhasResult] Same continuation token, ending pagination`);
                break;
            }
            if (items.length > 0 && addedThisPage === 0) {
                console.log(`[getGhasResult] No new items added this page, ending pagination`);
                break;
            }
            continuationToken = nextToken;
        }

        console.log(`[getGhasResult] ✓ Collected ${allFindings.length} total findings across ${page} pages (fromCache: ${fromCache})`);
        return { value: allFindings, fromCache };
    }

    async function loadLiveData() {
        const pat = document.getElementById('patInput').value.trim();
        if (!pat) { alert('Please enter a PAT first.'); return; }

        const btn = document.getElementById('loadLiveBtn');
        const status = document.getElementById('liveStatus');
        btn.disabled = true;

        const allRepos = (window.__clusters || [])
            .flatMap(cl => cl._projects)
            .flatMap(p => p.repos.map(r => ({ repoName: r, sanitized: sanitize(r) })));
        // deduplicate
        const seen = new Set();
        const uniqueRepos = allRepos.filter(r => seen.has(r.sanitized) ? false : (seen.add(r.sanitized), true));
        const total = uniqueRepos.length;
        let done = 0, cacheHits = 0, errors = 0;

        function setStatus(text, color) {
            status.style.color = color || '#adf';
            status.textContent = text;
        }

        setStatus(`⏳ Starting… 0 / ${total} repos`);

        for (const repo of uniqueRepos) {
            const sanitized = repo.sanitized;
            setStatus(`⏳ [${done + 1}/${total}] ${repo.repoName.slice(0, 28)}…`);
            try {
                const result = await getGhasResult(GHAS_PROJECT_ID, pat, sanitized);
                if (result.fromCache) cacheHits++;

                const findings = result.value || [];
                const act = { critical:0, high:0, medium:0, low:0 };
                const fix = { critical:0, high:0, medium:0, low:0 };
                for (const f of findings) {
                    const s = String(f?.severity || '').toLowerCase();
                    const isFixed = isResolved(f);
                    if (isFixed) { if (fix[s]!==undefined) fix[s]++; }
                    else { if (act[s]!==undefined) act[s]++; }
                }
                liveData[sanitized] = {
                    critical: act.critical, high: act.high, medium: act.medium, low: act.low,
                    totalActive: act.critical+act.high+act.medium+act.low,
                    fixedCritical: fix.critical, fixedHigh: fix.high, fixedMedium: fix.medium, fixedLow: fix.low,
                    totalFixed: fix.critical+fix.high+fix.medium+fix.low,
                    fromCache: result.fromCache
                };
            } catch (e) {
                errors++;
                console.warn('[Dashboard] failed repo', repo.repoName, e);
            }
            done++;
            const freshCount = done - cacheHits - errors;
            setStatus(`⏳ [${done}/${total}] — 📦 ${cacheHits} cached · 🌐 ${freshCount} fresh · ❌ ${errors} err`);
        }

        btn.disabled = false;
        const freshCount = done - cacheHits - errors;
        setStatus(`✅ Done — ${total} repos · 📦 ${cacheHits} cached · 🌐 ${freshCount} fresh · ❌ ${errors} err`, '#8f8');

        // Re-render with live data — recalculate totals from fresh liveData
        window.__clusters = window.__clusters.map(cl => ({
            ...cl,
            _totals: clusterTotals(cl._projects)
        }));
        render(window.__clusters);
        
        // Enrich with programmer attribution from commits for ALL clusters
        console.log('[Dashboard] Starting attribution enrichment for all clusters...');
        const projects = (window.__clusters || []).flatMap(cl => cl._projects);
        try {
            await buildCommitterData(projects, pat, msg => {
                console.log('[Dashboard] Attribution:', msg);
            });
            console.log('[Dashboard] ✓ Attribution enrichment complete');
            
            // Re-render everything after attribution is enriched
            // This will show all cluster cards + attribution tables + fixing activity
            await autoLoadAttribution(window.__clusters);
            
            // Re-render the fixing activity chart with fresh data
            await loadFixingActivityFragment();
            
            setStatus(`✅ Live data + Attribution loaded + Chart refreshed`, '#8f8');
        } catch (e) {
            console.warn('[Dashboard] Attribution enrichment failed:', e.message);
            setStatus(`✅ Live data loaded (attribution failed)`, '#f39c12');
        }
    }

    async function runRawTest() {
        const repoName = document.getElementById('debugRepo').value.trim();
        const pat = document.getElementById('patInput').value.trim();
        const extra = document.getElementById('debugExtraParam').value.trim();
        const out = document.getElementById('debugOut');
        if (!repoName || !pat) { out.innerHTML = '<span class="err">Enter repo name and PAT first.</span>'; return; }

        const sanitized = repoName.replace(/[\s_@#\$%\^&\*!]/g, '-');
        const base = `https://advsec.dev.azure.com/${organization}/${GHAS_PROJECT_ID}/_apis/alert/repositories/${sanitized}/alerts?api-version=7.2-preview.1&$top=100`;
        const url = extra ? `${base}&${extra}` : base;

        out.innerHTML = `<span class="warn">⏳ Raw fetch (bypassing cache)…\n  URL: ${url}</span>`;

        try {
            const resp = await fetch(url, { headers: { 'Authorization': 'Basic ' + btoa(':' + pat) } });
            const text = await resp.text();
            let parsed;
            try { parsed = JSON.parse(text); } catch { parsed = null; }

            const lines = [];
            lines.push(`<span class="head">HTTP ${resp.status} ${resp.statusText}</span>`);
            lines.push(`URL: ${url}`);
            lines.push(`continuationToken header: ${resp.headers.get('x-ms-continuationtoken') || 'none'}`);
            lines.push('');

            if (!resp.ok) {
                lines.push(`<span class="err">❌ API Error</span>`);
                lines.push(text.slice(0, 500));
            } else if (parsed?.value) {
                const items = parsed.value;
                const stateCounts = {}, sevCounts = {};
                for (const f of items) {
                    const s = String(f?.state||'?').toLowerCase();
                    const v = String(f?.severity||'?').toLowerCase();
                    stateCounts[s] = (stateCounts[s]||0)+1;
                    sevCounts[v]   = (sevCounts[v]  ||0)+1;
                }
                lines.push(`<span class="ok">✅ Got ${items.length} findings</span>`);
                lines.push('  By state: ' + Object.entries(stateCounts).map(([k,v])=>`${k}:${v}`).join(', '));
                lines.push('  By sev:   ' + Object.entries(sevCounts).map(([k,v])=>`${k}:${v}`).join(', '));
            } else {
                lines.push(`<span class="warn">⚠ No value array in response</span>`);
                lines.push(text.slice(0, 300));
            }
            out.innerHTML = lines.join('\n');
        } catch(e) {
            out.innerHTML = `<span class="err">❌ Fetch error: ${e.message}</span>`;
        }
    }

    async function runDebug() {
        const repoName = document.getElementById('debugRepo').value.trim();
        const pat = document.getElementById('patInput').value.trim();
        const out = document.getElementById('debugOut');
        const st  = document.getElementById('debugStatus');
        if (!repoName) { out.innerHTML = '<span class="err">Enter a repo name.</span>'; return; }
        if (!pat)      { out.innerHTML = '<span class="err">Enter your PAT in the header first.</span>'; return; }

        out.innerHTML = '<span class="warn">⏳ Fetching live data…</span>';
        st.textContent = '';

        const sanitized = repoName.replace(/[\s_@#\$%\^&\*!]/g, '-');
        let result, findings;
         
        console.log('════ [REPO INSPECTOR] START ════');
        console.log('[REPO] Repo name:', repoName);
        console.log('[REPO] Sanitized:', sanitized);
         
        try {
            console.log('[REPO] Fetching from getGhasResult()...');
            result   = await getGhasResult(GHAS_PROJECT_ID, pat, sanitized);
            findings = result.value || [];
            console.log('[REPO] ✓ Fetched', findings.length, 'findings');
            console.log('[REPO] ✓ From cache?', result.fromCache);
            if (result.fromCache) {
                console.log('[REPO] DATA SOURCE: 📦 COMPACTED CACHE (compressed format)');
            } else {
                console.log('[REPO] DATA SOURCE: 🌐 FRESH API (full format)');
            }
        } catch(e) {
            console.error('[REPO] ❌ API error:', e.message);
            out.innerHTML = `<span class="err">❌ API error: ${e.message}</span>`;
            return;
        }

        // --- Snapshot row ---
        const snap = liveData[sanitize(repoName)] || null;

        // --- State/severity breakdown ---
        const stateCounts  = {};
        const sevCounts    = {};
        const comboCounts  = {};
        for (const f of findings) {
            const state = String(f?.state || 'unknown').toLowerCase();
            const sev   = String(f?.severity || 'unknown').toLowerCase();
            stateCounts[state] = (stateCounts[state] || 0) + 1;
            sevCounts[sev]     = (sevCounts[sev]     || 0) + 1;
            const combo = `${sev}+${state}`;
            comboCounts[combo] = (comboCounts[combo] || 0) + 1;
        }
         
        console.log('[REPO] ─── FINDINGS BREAKDOWN ───');
        console.log('[REPO] By state:', stateCounts);
        console.log('[REPO] By severity:', sevCounts);
         
        // Check for attribution field
        const withAttribution = findings.filter(f => f?.attribution).length;
        const withoutAttribution = findings.filter(f => !f?.attribution).length;
        console.log('[REPO] Attribution status:');
        console.log('[REPO]   WITH attribution:', withAttribution);
        console.log('[REPO]   WITHOUT attribution:', withoutAttribution);
         
        if (findings.length > 0) {
            console.log('[REPO] Sample finding #0:');
            const sample = findings[0];
            console.log('[REPO]   alertId:', sample.alertId);
            console.log('[REPO]   state:', sample.state);
            console.log('[REPO]   severity:', sample.severity);
            console.log('[REPO]   fixedDate:', sample.fixedDate);
            console.log('[REPO]   attribution:', sample.attribution);
        }

        // --- Same logic as summarizeFixByDay (GHASResult) ---
        const knownSev = ['critical','high','medium','low'];
        const totalBySev = {critical:0,high:0,medium:0,low:0};
        const fixedBySev = {critical:0,high:0,medium:0,low:0};
        let allFixed = 0;
        for (const f of findings) {
            const state  = String(f?.state || '').toLowerCase();
            const sev    = String(f?.severity || '').toLowerCase();
            const isFixed = isResolved(f);
            if (knownSev.includes(sev)) totalBySev[sev]++;
            if (isFixed) { allFixed++; if (knownSev.includes(sev)) fixedBySev[sev]++; }
        }

        // --- Same logic as loadLiveData (Dashboard) ---
        const dashFixed = {critical:0,high:0,medium:0,low:0};
        for (const f of findings) {
            const sev    = String(f?.severity || '').toLowerCase();
            const isFixed = isResolved(f);
            if (isFixed && dashFixed[sev] !== undefined) dashFixed[sev]++;
        }

        // --- Sample fixed-date fields ---
        const sampleFixed = findings.filter(isResolved).slice(0, 3);

        const lines = [];
        lines.push(`<span class="head">═══ CACHE DATA (sessionStorage) ═══</span>`);
        if (snap) {
            lines.push(`  C (active): ${snap.critical}  H: ${snap.high}  M: ${snap.medium}  L: ${snap.low}`);
            lines.push(`  totalActive : ${snap.totalActive}`);
            lines.push(`  totalFixed  : ${snap.totalFixed}  ← from cache (fixed findings count)`);
        } else {
            lines.push(`  <span class="err">⚠ NOT FOUND in cache. Load live data first.</span>`);
        }

        lines.push('');
        lines.push(`<span class="head">═══ LIVE API (${result.fromCache ? '📦 from cache' : '🌐 fresh'}) ═══</span>`);
        lines.push(`  sanitized URL name : ${sanitized}`);
        lines.push(`  total findings returned : ${findings.length}`);

        lines.push('');
        lines.push(`<span class="head">  — By state —</span>`);
        for (const [k,v] of Object.entries(stateCounts).sort()) lines.push(`  ${k.padEnd(14)}: ${v}`);

        lines.push('');
        lines.push(`<span class="head">  — By severity —</span>`);
        for (const [k,v] of Object.entries(sevCounts).sort()) lines.push(`  ${k.padEnd(14)}: ${v}`);

        lines.push('');
        lines.push(`<span class="head">  — By severity+state combos —</span>`);
        for (const [k,v] of Object.entries(comboCounts).sort()) lines.push(`  ${k.padEnd(24)}: ${v}`);

        lines.push('');
        lines.push(`<span class="head">═══ CALCULATED (GHASResult logic) ═══</span>`);
        lines.push(`  "Total" row  — all findings by sev (active+fixed):`);
        lines.push(`    C:${totalBySev.critical} H:${totalBySev.high} M:${totalBySev.medium} L:${totalBySev.low}`);
        lines.push(`  "Fixed" row  — isResolved (state==='fixed' OR 'dismissed'; reopened excluded):`);
        lines.push(`    C:${fixedBySev.critical} H:${fixedBySev.high} M:${fixedBySev.medium} L:${fixedBySev.low}  (total: ${allFixed})`);

        lines.push('');
        lines.push(`<span class="head">═══ CALCULATED (Dashboard loadLiveData logic) ═══</span>`);
        const dbActive = {critical:0,high:0,medium:0,low:0};
        for (const f of findings) {
            const s = String(f?.severity||'').toLowerCase();
            const isFixed = isResolved(f);
            if (!isFixed && dbActive[s]!==undefined) dbActive[s]++;
        }
        const dbTotalActive = Object.values(dbActive).reduce((a,b)=>a+b,0);
        lines.push(`  Active bySev (used for C/H/M/L): C:${dbActive.critical} H:${dbActive.high} M:${dbActive.medium} L:${dbActive.low} (total: ${dbTotalActive})`);
        lines.push(`  Fixed bySev: always 0 without state filter — API limitation`);

        if (snap) {
            const cachedFixed = snap.totalFixed;
            const liveRate = (dbTotalActive + cachedFixed) > 0 ? (cachedFixed / (dbTotalActive + cachedFixed) * 100) : 0;
            lines.push('');
            lines.push(`<span class="head">═══ FIX RATE (from cache) ═══</span>`);
            lines.push(`  ${cachedFixed} fixed / (${dbTotalActive} active + ${cachedFixed} fixed) = <span class="ok">${liveRate.toFixed(1)}%</span>`);
        }

        // --- Attribution Analysis ---
        const fixedWithAttrib = findings.filter(f => isResolved(f) && f?.attribution?.name).length;
        const fixedWithoutAttrib = findings.filter(f => isResolved(f) && !f?.attribution?.name).length;
        const programmers = {};
        for (const f of findings) {
            if (isResolved(f) && f?.attribution?.name) {
                programmers[f.attribution.name] = (programmers[f.attribution.name] || 0) + 1;
            }
        }

        if (sampleFixed.length) {
            lines.push('');
            lines.push(`<span class="head">═══ SAMPLE FIXED FINDINGS (up to 3) ═══</span>`);
            for (const f of sampleFixed) {
                const prog = f?.attribution?.name || '(no attribution)';
                lines.push(`  alertId:${f.alertId} sev:${f.severity} programmer:${prog} fixedDate:${f.fixedDate || 'n/a'}`);
            }
        }

        lines.push('');
        lines.push(`<span class="head">═══ ATTRIBUTION STATUS ═══</span>`);
        lines.push(`  Fixed findings with programmer name: ${fixedWithAttrib}`);
        lines.push(`  Fixed findings WITHOUT programmer: ${fixedWithoutAttrib}`);
        if (fixedWithAttrib > 0) {
            lines.push(`  <span class="head">  Programmers (fixes by person):</span>`);
            for (const [name, count] of Object.entries(programmers).sort((a, b) => b[1] - a[1])) {
                lines.push(`    ${name}: ${count}`);
            }
        }

        out.innerHTML = lines.join('\n');
        st.textContent = `inspected ${findings.length} findings`;
         
        console.log('════ [REPO INSPECTOR] END ════');
        console.log('[REPO] ✓ Inspection complete');
        console.log('[REPO]   Findings with attribution:', withAttribution);
        console.log('[REPO]   Findings without attribution:', withoutAttribution);
    }

    async function viewRawCache() {
        const repoName = document.getElementById('debugRepo').value.trim();
        const out = document.getElementById('debugOut');
        if (!repoName) { out.innerHTML = '<span class="err">Enter repo name.</span>'; return; }

        try {
            const allEntries = await window.GHASResult.getAllCacheEntries();
            const matching = allEntries.filter(e => e.key?.toLowerCase().includes(repoName.toLowerCase()));
            
            const lines = [];
            lines.push(`<span class="head">═══ RAW CACHE DATA ═══</span>`);
            lines.push(`Repository: ${repoName}`);
            lines.push(`Matching entries: ${matching.length}`);
            
            if (matching.length === 0) {
                lines.push(`<span class="warn">⚠ No cache found. Load repo in GHASResult.html first.</span>`);
            } else {
                for (let i = 0; i < matching.length; i++) {
                    const entry = matching[i];
                    const findings = entry.data?.payload?.value || [];
                    
                    lines.push('');
                    lines.push(`<span class="head">Entry ${i + 1}: ${findings.length} findings</span>`);
                    
                    // Count attribution status
                    const withAttrib = findings.filter(f => f?.attribution?.name).length;
                    const withoutAttrib = findings.filter(f => !f?.attribution?.name).length;
                    lines.push(`  With attribution: ${withAttrib}  |  Without: ${withoutAttrib}`);
                    lines.push('');
                    
                    // Show first 3 findings in detail
                    for (let j = 0; j < Math.min(3, findings.length); j++) {
                        const f = findings[j];
                        lines.push(`  [${j + 1}] alertId: ${f.alertId}`);
                        lines.push(`      state: ${f.state}  |  severity: ${f.severity}`);
                        lines.push(`      fixedDate: ${f.fixedDate || 'null'}`);
                        lines.push(`      attribution: ${f.attribution ? JSON.stringify(f.attribution) : 'null'}`);
                    }
                    
                    if (findings.length > 3) {
                        lines.push(`  ... and ${findings.length - 3} more`);
                    }
                }
            }

            out.innerHTML = lines.join('\n');
        } catch (e) {
            out.innerHTML = `<span class="err">Error: ${e.message}</span>`;
            console.error('[DEBUG] viewRawCache error:', e);
        }
    }

    async function init() {
        let clusterDef;
        try {
            const res = await fetch('./GHASCluster.json');
            clusterDef = await res.json();
        } catch {
            document.getElementById('clusterCards').innerHTML = '<div style="color:red">Failed to load GHASCluster.json.</div>';
            return;
        }

        // Store cluster config for use by embedded fragments
        window.__clusterDef = clusterDef;

        // Auto-mount from IndexedDB cache (shared across tabs)
        await loadFromCache();
        const cachedCount = Object.keys(liveData).length;

        const clusters = clusterDef.clusters.map(cl => {
            const projects = aggregateProjects(cl.projects);
            const totals = clusterTotals(projects);
            return { ...cl, _projects: projects, _totals: totals };
        });

        window.__clusters = clusters;
        render(clusters);

        const st = document.getElementById('liveStatus');
        if (cachedCount > 0) {
            st.textContent = `📦 Auto-loaded ${cachedCount} repos from cache`;
            st.style.color = '#adf';
            
            // Auto-load programmer attribution if cache has enriched data
            console.log('[Dashboard] Checking if cache has attribution data...');
            const hasAttribution = await checkCacheForAttribution();
            if (hasAttribution) {
                console.log('[Dashboard] Found attribution in cache, auto-loading...');
                try {
                    await autoLoadAttribution(clusters);
                    console.log('[Dashboard] ✓ Attribution auto-loaded on page refresh');
                } catch (e) {
                    console.warn('[Dashboard] Auto-load attribution failed:', e.message);
                }
            }
        } else {
            st.textContent = 'No cache found — enter PAT and click Load Live Data (or visit GHASResult first)';
            st.style.color = '#f39c12';
        }
    }
    
    // Check if any cached findings have attribution field
    async function checkCacheForAttribution() {
        try {
            const entries = await window.GHASResult.getAllCacheEntries();
            for (const { data: entry } of entries) {
                if (!entry?.payload?.value) continue;
                const hasAttr = entry.payload.value.some(f => f?.attribution?.name);
                if (hasAttr) return true;
            }
            return false;
        } catch (e) {
            console.warn('[Dashboard] checkCacheForAttribution error:', e);
            return false;
        }
    }
    
    // Auto-render programmer attribution tables per cluster if cache has data
    async function autoLoadAttribution(clusters) {
        try {
            for (const cl of clusters) {
                const projects = cl._projects;
                const clusterRepos = projects.flatMap(p => p.repos);
                
                // Get already-enriched findings from cache for this cluster
                const fixedByRepo = await getFixedFindingsFromCache(clusterRepos);
                
                // Build committer data for this cluster only
                const byCommitter = {};
                for (const [repoName, findings] of Object.entries(fixedByRepo)) {
                    for (const f of findings) {
                        if (!f?.attribution?.name) continue;
                        const name = f.attribution.name;
                        if (!byCommitter[name]) {
                            byCommitter[name] = {
                                weeks: [
                                    { label: 'This Week', critical: 0, high: 0, medium: 0, low: 0 },
                                    { label: '1 Week Ago', critical: 0, high: 0, medium: 0, low: 0 },
                                    { label: '2 Weeks Ago', critical: 0, high: 0, medium: 0, low: 0 },
                                    { label: '3 Weeks Ago', critical: 0, high: 0, medium: 0, low: 0 }
                                ],
                                older: { label: 'Older', critical: 0, high: 0, medium: 0, low: 0 }
                            };
                        }
                        
                        // Calculate week bucket from fixedDate
                        const fixedDate = new Date(f.fixedDate);
                        const now = new Date();
                        const daysSince = Math.floor((now - fixedDate) / (1000 * 60 * 60 * 24));
                        const weekIndex = Math.floor(daysSince / 7);
                        const sev = String(f.severity || 'low').toLowerCase().substring(0, 1);
                        
                        let bucket;
                        if (weekIndex < 4) {
                            bucket = byCommitter[name].weeks[weekIndex];
                        } else {
                            bucket = byCommitter[name].older;
                        }
                        
                        if (sev === 'c') bucket.critical++;
                        else if (sev === 'h') bucket.high++;
                        else if (sev === 'm') bucket.medium++;
                        else bucket.low++;
                    }
                }
                
                const entries = Object.entries(byCommitter).sort(([, a], [, b]) => {
                    const score = d => d.weeks.reduce((s, w) => s + w.critical*8+w.high*4+w.medium*2+w.low, 0)
                                       + d.older.critical*8 + d.older.high*4 + d.older.medium*2 + d.older.low;
                    return score(b) - score(a);
                });

                if (entries.length === 0) continue;

                // Find the section body for this cluster
                const sectionBody = document.getElementById(`section-body-${cl.id}`);
                if (!sectionBody) continue;

                // Find or create programmer section within this cluster's body
                let progSection = sectionBody.querySelector('.prog-section');
                if (!progSection) {
                    progSection = document.createElement('div');
                    progSection.className = 'prog-section';
                    sectionBody.appendChild(progSection);
                }

                const hdr = document.createElement('div');
                hdr.className = 'prog-section-header';
                hdr.innerHTML = `<span>👤 Programmer Attribution (auto-loaded)</span>`;

                const tableWrap = document.createElement('div');
                tableWrap.style.overflowX = 'auto';

                const table = document.createElement('table');
                table.className = 'prog-table';
                table.innerHTML = `
                  <thead>
                    <tr>
                      <th>Programmer</th>
                      <th>Week</th>
                      <th style="color:#c0392b;text-align:right">Crit</th>
                      <th style="color:#e67e22;text-align:right">High</th>
                      <th style="color:#2980b9;text-align:right">Med</th>
                      <th style="color:#888;text-align:right">Low</th>
                      <th style="text-align:right">Total</th>
                    </tr>
                  </thead>`;

                const tbody = document.createElement('tbody');
                const n = (v, color) => v > 0
                    ? `<td class="num" style="color:${color};font-weight:bold">${v}</td>`
                    : `<td class="num dim">-</td>`;

                for (const [name, d] of entries) {
                    const rows = [];
                    for (const w of d.weeks) {
                        const tot = w.critical + w.high + w.medium + w.low;
                        if (tot > 0) rows.push({ label: w.label, ...w });
                    }
                    const oldTot = d.older.critical + d.older.high + d.older.medium + d.older.low;
                    if (oldTot > 0) rows.push({ label: d.older.label, ...d.older });
                    if (rows.length === 0) continue;

                    rows.forEach((row, idx) => {
                        const tr = document.createElement('tr');
                        if (idx > 0) tr.style.borderTop = '1px solid #f0f0f0';
                        tr.innerHTML = `
                            ${idx === 0 ? `<td style="font-weight:bold;border-bottom:1px solid #e0d0f0">${name}</td>` : '<td></td>'}
                            <td>${row.label}</td>
                            ${n(row.critical, '#c0392b')}
                            ${n(row.high, '#e67e22')}
                            ${n(row.medium, '#2980b9')}
                            ${n(row.low, '#888')}
                            <td class="num" style="font-weight:bold">${row.critical+row.high+row.medium+row.low}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }

                if (tbody.children.length > 0) {
                    table.appendChild(tbody);
                    tableWrap.appendChild(table);
                    progSection.innerHTML = '';
                    progSection.appendChild(hdr);
                    progSection.appendChild(tableWrap);
                    console.log(`[Dashboard] ✓ Programmer attribution auto-loaded for ${cl.name}`);
                }
            }
        } catch (e) {
            console.warn('[Dashboard] autoLoadAttribution error:', e);
        }
    }

</script>
