<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project List for GHAS</title>
    <style>
        #loadingIndicator {
            display: none;
            font-weight: bold;
        }
        #progressContainer {
            margin-top: 20px;
            width:100%;
            border: 1px solid green;
        }
        #progressBar {
            width: 0%;
            height: 30px;
            background-color: green;
            text-align: center;
            color: white;
        }
#projectList{
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
}
.project-block {
  flex: 1 1 calc(24% - 2rem);
  margin: 0.4rem;
  padding: 0.6rem;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: #f9f9f9;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.project-name {
    font-weight: bold;
    font-size: 1rem;
    margin-bottom: 0.4rem;
    text-align: center;
}

.severity-blocks {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 0.4rem;
}

.severity {
    flex: 1 1 calc(20% - 2rem);
    min-width: 10%;
    padding: 0.4rem;
    border-radius: 6px;
    color: white;
    text-align: center;
    font-weight: bold;
    font-size: 1.2rem;
}

.critical { background-color: #e74c3c; }
.high { background-color: #e67e22; }
.medium { background-color: #f1c40f; color: #333; }
.other { background-color: #95a5a6; }

@media (max-width: 600px) {
    .severity {
        flex: 1 1 100%;
    }
}
    </style>
</head>
<body>
<form id="patForm">
    <input type="text" id="PAT" name="PAT" placeholder="Enter PAT" required />
    <input type="submit" value="Submit" />
</form>
<h1>GHAS Open Case</h1>
<div id="progressContainer">
    <div id="progressBar"></div>
</div>
<div id="projectList"></div>

<script>
    const organization = 'itbinus'; // Replace with your organization name

    document.getElementById('patForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        const pat = document.getElementById('PAT').value.trim();

        if (!pat) {
            console.error('PAT is required.');
            return;
        }

        try {
            const projectListElement = document.getElementById('projectList');
            const data = await getProjects(pat);

            const totalProjects = data.value.length;
            const loadedProjects = { count: 0 };

            const projectPromises = data.value.map(project =>
                renderProjectDetails(project, projectListElement, loadedProjects, totalProjects, pat)
            );

            await Promise.all(projectPromises);            
            console.log(dashboardData);
            setTimeout('printDashboard()', 1000);
        } catch (error) {
            console.error('Error fetching data:', error);
        }
    });
    

    async function printDashboard(){
        const container = document.getElementById("projectList");

        Object.values(dashboardData).forEach(project => {
            const projectDiv = document.createElement("div");
            projectDiv.className = "project-block";

            projectDiv.innerHTML = `
                <div class="project-name">${project.repo}</div>
                <div class="severity-blocks">
                    <div class="severity critical">${project.critical}</div>
                    <div class="severity high">${project.high}</div>
                    <div class="severity medium">${project.medium}</div>
                    <div class="severity other">${project.other}</div>
                </div>
            `;

            container.appendChild(projectDiv);
            console.log(project.repo);
        });
    }

    async function fetchData(url, pat) {
        const response = await fetch(url, {
            method: 'GET',
            headers: {
                'Authorization': 'Basic ' + btoa(':' + pat)
            }
        });
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.json();
    }

    async function getProjects(pat) {
        const apiUrl = `https://dev.azure.com/${organization}/_apis/projects?api-version=5.1`;
        return fetchData(apiUrl, pat);
    }

    async function getPipelines(projectId, pat) {
    	const pipelineUrl = `https://dev.azure.com/${organization}/${projectId}/_apis/build/definitions?api-version=5.1`;
    	return fetchData(pipelineUrl, pat);
    }

    async function getGhasResult(projectId, pat, repo) {
    	const pipelineUrl = `https://advsec.dev.azure.com/${organization}/${projectId}/_apis/alert/repositories/${repo}/alerts?api-version=7.2-preview.1`;
    	return fetchData(pipelineUrl, pat);
    }

    const dashboardData = {};

    async function renderProjectDetails(project, projectListElement, loadedProjects, totalProjects, pat) {
        try {

            var c = 1;

            const pipelines = await getPipelines(project.id, pat);
            const matchingPipeline = pipelines.value.filter(pipeline => 
    		["CI_GHAS_", "CI_FE_GHAS_", "CI_LE_GHAS_"].some(prefix => pipeline.name.startsWith(prefix))
	        );
            for (const pipeline of matchingPipeline) {
               renderPipelineLink(c++, pat, project.id, pipeline);

            }            

            loadedProjects.count++;
            const progressPercentage = (loadedProjects.count / totalProjects) * 100;
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = `${progressPercentage}%`;

        } catch (error) {
            console.error('Error processing project details:', error);
        }
    }

    async function renderPipelineLink(c, pat, projectId, pipeline) {
        
        try {
            const sanitizedPipelineName = pipeline.name.replace(/^(CI_GHAS_|CI_FE_GHAS_|CI_LE_GHAS_)/, "");
            const findings = await getGhasResult('1f663eb2-dd63-4b51-b000-f0949e3c8ab0', pat, sanitizedPipelineName);
            if (findings.value && Array.isArray(findings.value)) {

                findings.value.forEach(finding => {
                    if(finding.state === "active") {
                        const projectName = sanitizedPipelineName; // Adjust if multiple pipelines exist
                        if (!dashboardData[projectName]) {
                            dashboardData[projectName] = {
                                repo: projectName,
                                critical: 0,
                                high: 0,
                                medium: 0,
                                other: 0
                            };
                        }

                        switch (finding.severity) {
                            case "critical":
                                dashboardData[projectName].critical++;
                                break;
                            case "high":
                                dashboardData[projectName].high++;
                                break;
                            case "medium":
                                dashboardData[projectName].medium++;
                                break;
                            default:
                                dashboardData[projectName].other++;
                                break;
                        }
                    }
                    
                });
            } else {
                findingsCell.textContent = "No findings found";
            }
        } catch (error) {
            findingsCell.textContent = "Error fetching findings";
            console.error("Error fetching GHAS findings:", error);
        }

    }
    
</script>
</body>
</html>
